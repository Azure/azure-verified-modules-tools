author: AVM
name: avm-repos
description: Gets AVM repositories based on GH app installation and outputs them as a JSON array.
inputs:
  repositories:
    description: "Target repositories, comma separated list to select specific repositories: 'avm-res-keyvault-vault'."
    default: "All"
  repositoriesToSkip:
    description: "Additional repositories to skip, as a comma separated list."
    default: ""
  outputDirectory:
    description: "Output directory for the repository data"
    default: "${{ github.workspace }}"
  clientId:
    description: "GitHub App Client ID"
    required: true
  privateKey:
    description: "GitHub App Private Key"
    required: true
outputs:
  matrix:
    description: The repository data
    value: ${{ steps.matrix.outputs.matrix }}
  matrixParallel:
    description: The number of parallel jobs to run
    value: ${{ steps.matrix.outputs.matrixParallel }}

runs:
  using: composite
  steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.clientId }}
        private-key: ${{ inputs.privateKey }}
        owner: ${{ github.repository_owner }}

    - name: Generate matrix
      id: matrix
      run: |
        $ErrorActionPreference = 'Stop'
        . (Join-Path $env:AVM_REPOS_ACTION_PATH '..' '..' 'scripts' 'lib' 'Logging.ps1')
        $matrixParallel = 5
        Write-Output "matrixParallel=$matrixParallel" >> $env:GITHUB_OUTPUT

        $selection = ([string]$env:REPOSITORIES).Trim()
        if ([string]::IsNullOrWhiteSpace($selection) -or $selection -ieq 'All') {
          $repositories = @()
          Write-Information 'Repository selection: all eligible installed AVM repositories.' -InformationAction Continue
        } else {
          $repositories = @($selection -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ } | Select-Object -Unique)
          if ($repositories -contains 'All' -or $repositories.Count -eq 0) {
            throw 'Use All on its own, or a comma-separated list of repository IDs.'
          }
          Write-Information "Repository selection: $($repositories.Count) explicit repositories." -InformationAction Continue
        }

        $repositoriesToSkip = @($env:REPOSITORIES_TO_SKIP -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ } | Select-Object -Unique)
        $matrix = @(Invoke-RepositorySyncLogGroup -Name 'Repository discovery and matrix details' -Action {
          Write-Information "Included IDs: $(ConvertTo-Json -InputObject $repositories -Compress)" -InformationAction Continue
          Write-Information "Additional exclusions: $(ConvertTo-Json -InputObject $repositoriesToSkip -Compress)" -InformationAction Continue
          $selected = @(& (Join-Path $env:AVM_REPOS_ACTION_PATH 'scripts' 'Get-RepositoriesWhereAppInstalled.ps1') `
            -repoFilter $repositories `
            -outputDirectory $env:OUTPUT_DIRECTORY `
            -additionalReposToSkip $repositoriesToSkip)
          Write-Information (ConvertTo-Json -InputObject $selected -Depth 10) -InformationAction Continue
          $selected
        })
        $matrixJson = ConvertTo-Json -InputObject $matrix -Depth 10 -Compress
        Write-Output "matrix=$matrixJson" >> $env:GITHUB_OUTPUT
        Write-Information "Matrix ready: $($matrix.Count) repositories; maximum parallel jobs: $matrixParallel; additional exclusions: $($repositoriesToSkip.Count)." -InformationAction Continue
        $global:LASTEXITCODE = 0
      shell: pwsh
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        AVM_REPOS_ACTION_PATH: ${{ github.action_path }}
        REPOSITORIES: ${{ inputs.repositories }}
        REPOSITORIES_TO_SKIP: ${{ inputs.repositoriesToSkip }}
        OUTPUT_DIRECTORY: ${{ inputs.outputDirectory }}

    - name: Upload repository log JSON
      if: always() && hashFiles('issues.log.json') != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: issues.log.json
        path: issues.log.json

    - name: Report repository issues
      if: always() && hashFiles('issues.log.json') != ''
      run: |
        $issueLogJson = Get-Content -Path "${{ github.workspace }}/issues.log.json" -Raw
        $issueLog = ConvertFrom-Json $issueLogJson
        $issueLog | Where-Object { $_.severity -eq "error" } | ForEach-Object {
          echo "::error title=$($_.repoId) has issues::$($_.message)"
        }
        $issueLog | Where-Object { $_.severity -eq "warning" } | ForEach-Object {
          echo "::warning title=$($_.repoId) has issues::$($_.message)"
        }
      shell: pwsh
