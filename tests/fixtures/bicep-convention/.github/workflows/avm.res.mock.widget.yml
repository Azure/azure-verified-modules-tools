name: AVM fixture

on:
  workflow_dispatch:
    inputs:
      staticValidation:
        type: boolean
        default: true
      deploymentValidation:
        type: boolean
        default: true
      removeDeployment:
        type: boolean
        default: true
      customLocation:
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/avm.res.mock.widget.yml
      - avm/res/mock/widget/**
      - '!*/**/README.md'
      - '!avm/**/metadata.json'

env:
  workflowPath: .github/workflows/avm.res.mock.widget.yml
  modulePath: avm/res/mock/widget

jobs:
  job_initialize_pipeline:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !(github.repository != 'Azure/bicep-registry-modules' && github.event_name != 'workflow_dispatch') }}
    steps:
      - run: Write-Output 'fixture'
