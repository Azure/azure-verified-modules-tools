name: 'Workflows: CI'

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_MultiCoreJitMinNumCpus: '7fffffff'

jobs:
  workflows:
    name: Workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build prerequisites
        shell: pwsh
        run: ./scripts/Install-AvmBuildPrerequisites.ps1 -Confirm:$false

      - name: Run workflow tests
        shell: pwsh
        run: ./build.ps1 test-workflows

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-workflows-ubuntu-latest
          path: out/test-results/*.xml
          if-no-files-found: warn
          retention-days: 7
