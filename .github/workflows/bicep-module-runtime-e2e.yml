name: 'Reusable: Bicep Module Runtime E2E'

on:
  workflow_call:
    inputs:
      workflowInput:
        type: string
        required: true
      modulePath:
        type: string
        required: true
      moduleTestFilePaths:
        type: string
        required: true
      targetCommit:
        type: string
        required: true
      authoringArtifact:
        type: string
        default: ''

permissions: {}

jobs:
  select-deployments:
    name: '${{ inputs.modulePath }}: Select E2E test subscriptions'
    environment: avm-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AVM_AUTHORING_MODULE: Avm.Authoring
    outputs:
      deploymentMatrix: ${{ steps.select.outputs.deploymentMatrix }}
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.targetCommit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download prepared authoring runtime
        if: inputs.authoringArtifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.authoringArtifact }}
          path: ${{ runner.temp }}/avm-authoring
      - name: Select prepared authoring runtime
        if: inputs.authoringArtifact != ''
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Prepared Avm.Authoring manifest is missing.' }
          "AVM_AUTHORING_MODULE=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Select deployments
        id: select
        shell: pwsh
        env:
          MODULE_PATH: ${{ inputs.modulePath }}
          TEST_FILES: ${{ inputs.moduleTestFilePaths }}
          TEST_SUBSCRIPTION_IDS: ${{ vars.VALIDATE_SUBSCRIPTION_IDS || vars.TEST_SUBSCRIPTION_IDS || secrets.VALIDATE_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          VALIDATE_SUBSCRIPTION_ID: ${{ vars.VALIDATE_SUBSCRIPTION_ID || secrets.VALIDATE_SUBSCRIPTION_ID }}
          VALIDATE_MODULE_CLIENT_IDS: ${{ vars.VALIDATE_MODULE_CLIENT_IDS }}
          VALIDATE_TENANT_ID: ${{ vars.VALIDATE_TENANT_ID || secrets.VALIDATE_TENANT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AVM_AUTHORING_MODULE -eq 'Avm.Authoring') {
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
                Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
              }
              Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
              Install-PSResource -Name Avm.Authoring -Scope CurrentUser -TrustRepository -ErrorAction Stop
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) { throw }
              $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
              Write-Warning "Avm.Authoring installation failed on attempt $attempt of ${maxAttempts}: $($_.Exception.Message). Retrying in $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          }
          Import-Module $env:AVM_AUTHORING_MODULE -ErrorAction Stop
          $capabilities = (Get-Module Avm.Authoring).PrivateData.AvmCapabilities
          if ($capabilities.BicepWorkflowE2eRuntime -isnot [int] -or $capabilities.BicepWorkflowE2eRuntime -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepWorkflowE2eRuntime = 1.'
          }
          $testFiles = @(ConvertFrom-Json -InputObject $env:TEST_FILES -AsHashtable)
          $matrix = @(Get-AvmBicepE2eDeploymentMatrix -Root $env:GITHUB_WORKSPACE -ModulePath $env:MODULE_PATH `
              -TestFiles $testFiles -PoolJson $env:TEST_SUBSCRIPTION_IDS -FallbackSubscriptionId $env:VALIDATE_SUBSCRIPTION_ID `
              -ModuleClientIds $env:VALIDATE_MODULE_CLIENT_IDS -TenantId $env:VALIDATE_TENANT_ID `
              -RandomSeed ([int](([long]$env:GITHUB_RUN_ID + [long]$env:GITHUB_RUN_ATTEMPT) % [int]::MaxValue)) `
              -DisplaySubscriptionNames:($env:TEST_SUBSCRIPTION_IDS -ne '') -SkipModuleVersionCheck)
          $value = ConvertTo-Json -InputObject $matrix -Depth 20 -Compress
          "deploymentMatrix=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  deploy:
    name: '${{ inputs.modulePath }}: E2E deployment validation'
    needs: select-deployments
    if: |
      !cancelled() &&
      fromJSON(inputs.workflowInput).deploymentValidation == 'true' &&
      inputs.moduleTestFilePaths != '' && inputs.moduleTestFilePaths != '[]' &&
      needs.select-deployments.result == 'success'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        testCase: ${{ fromJSON(needs.select-deployments.outputs.deploymentMatrix) }}
    uses: ./.github/workflows/bicep-module-runtime-deployment.yml
    with:
      modulePath: ${{ inputs.modulePath }}
      workflowInput: ${{ inputs.workflowInput }}
      testCase: ${{ toJSON(matrix.testCase) }}
      targetCommit: ${{ inputs.targetCommit }}
      authoringArtifact: ${{ inputs.authoringArtifact }}
    secrets: inherit
