name: 'Reusable: Bicep Module Publish Only'

on:
  workflow_call:
    inputs:
      tools-ref:
        description: Full tools commit SHA, identical to the caller's workflow revision.
        type: string
        required: true
      avm-authoring-version:
        description: Exact qualified Avm.Authoring release.
        type: string
        required: true
      modulePath:
        type: string
        required: true
      baseCommit:
        type: string
        required: false
      targetCommit:
        type: string
        required: true
      forcePublish:
        type: boolean
        required: false
        default: false
      requirePublishApproval:
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  job_publish_approval:
    name: Approve release tag creation
    environment: publish-approval
    runs-on: ubuntu-latest
    permissions: {}
    if: inputs.requirePublishApproval && github.ref == 'refs/heads/main' && github.repository == 'Azure/bicep-registry-modules'
    steps:
      - name: Record approval
        shell: pwsh
        run: Write-Output 'Release tag creation approved.'

  job_publish_module:
    name: Publishing
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: avm-publish-${{ inputs.modulePath }}
      queue: max
    if: |
      !cancelled() &&
      (!inputs.requirePublishApproval || needs.job_publish_approval.result == 'success') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Azure/bicep-registry-modules'
    needs:
      - job_publish_approval
    steps:
      - name: Validate tools revision
        shell: pwsh
        env:
          TOOLS_REF: ${{ inputs.tools-ref }}
          TARGET_COMMIT: ${{ inputs.targetCommit }}
        run: |
          if ($env:TOOLS_REF -cnotmatch '^[0-9a-f]{40}$' -or $env:TARGET_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Workflow revisions must be full immutable commit SHAs.' }
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.targetCommit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out workflow support
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Azure/azure-verified-modules-tools
          ref: ${{ inputs.tools-ref }}
          path: .avm-tools
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts/bicep-workflows
      - name: Create module release tags
        uses: ./.avm-tools/.github/actions/bicep-release-tags
        with:
          avm-authoring-version: ${{ inputs.avm-authoring-version }}
          modulePath: ${{ inputs.modulePath }}
          baseCommit: ${{ inputs.baseCommit }}
          targetCommit: ${{ inputs.targetCommit }}
          forcePublish: ${{ inputs.forcePublish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
