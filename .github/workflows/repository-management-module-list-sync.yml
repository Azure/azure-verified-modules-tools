---
name: 'Repos: Module List Sync'

# Design invariants -- do not regress these without a very good reason:
#  - schedule + workflow_dispatch + guarded workflow_call. This opens pull
#    requests with a scoped cross-repo app token.
#  - Four offset six-hour reconciliation runs ('13 */6 * * *').
#  - The generated pull request is auto-merged (squash) through the same
#    VerifyCandidate/ExpectedActor-gated path the terraform pre-commit flow
#    uses, once verification of the actor/branch/tree state passes.
#  - The catalog-derived module list is compared against a stable branch/PR
#    (avm-bot/sync-module-dropdown) so repeated runs update the same PR instead of
#    opening a new one every day the catalog stays ahead of the template.
on:
  workflow_call:
    inputs:
      what_if:
        type: boolean
        default: true
    secrets:
      AVM_APP_PRIVATE_KEY:
        required: false
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
    inputs:
      what_if:
        description: 'Compute and log the module dropdown diff without opening or updating a pull request.'
        default: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: repository-management-module-list-sync
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  sync:
    name: Sync module dropdown list
    if: >-
      github.repository == 'Azure/azure-verified-modules-tools' &&
      github.ref == 'refs/heads/main' &&
      (github.workflow_ref == 'Azure/azure-verified-modules-tools/.github/workflows/repository-management-module-list-sync.yml@refs/heads/main' ||
       github.workflow_ref == 'Azure/azure-verified-modules-tools/.github/workflows/module-metadata-sync.yml@refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: avm
    steps:
      - name: Checkout trusted tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Avm.Authoring
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (-not @(Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet |
                  Where-Object { $_.Version -ge [version]'1.1.1' }).Count) {
                Install-Module -Name Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.1 `
                  -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
              }
              Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.1 -ErrorAction Stop
              $repositories = @(Get-PSResourceRepository -ErrorAction Stop)
              if (@($repositories | Where-Object { ([string]$_.Uri).TrimEnd('/') -ieq 'https://mcr.microsoft.com' }).Count -eq 0) {
                Register-PSResourceRepository -Name MAR -Uri 'https://mcr.microsoft.com/' -ApiVersion ContainerRegistry -Trusted -ErrorAction Stop
                $repositories = @(Get-PSResourceRepository -ErrorAction Stop)
              }
              $repositories = @($repositories | Sort-Object Priority, Name)
              if ($repositories.Count -eq 0) { throw [InvalidOperationException]::new('No PowerShell repositories are configured.') }
              $releases = [Collections.Generic.List[object]]::new()
              $lookupFailure = $null
              foreach ($repository in $repositories) {
                try {
                  foreach ($candidate in @(Find-PSResource -Name Avm.Authoring -Repository $repository.Name -ErrorAction Stop)) {
                    [version] $version = $null
                    if ([version]::TryParse([string]$candidate.Version, [ref]$version)) {
                      $releases.Add([pscustomobject]@{ Version = $version; Repository = $repository.Name })
                    }
                  }
                }
                catch {
                  $lookupFailure = $_
                  Write-Verbose "PowerShell repository '$($repository.Name)' could not find Avm.Authoring; trying the next configured repository."
                }
              }
              if ($releases.Count -eq 0) {
                if ($null -ne $lookupFailure) { throw $lookupFailure }
                throw [InvalidOperationException]::new('No stable Avm.Authoring package was found in the configured PowerShell repositories.')
              }
              $release = $null
              foreach ($candidate in $releases) {
                if ($null -eq $release -or $candidate.Version -gt $release.Version) { $release = $candidate }
              }
              $installed = $false
              foreach ($repository in $repositories) {
                if ($repository.Name -notin @($releases | Where-Object Version -EQ $release.Version | ForEach-Object Repository)) { continue }
                try {
                  Install-PSResource -Name Avm.Authoring -Version $release.Version.ToString() -Repository $repository.Name -Scope CurrentUser -TrustRepository -ErrorAction Stop
                  $installed = $true
                  break
                }
                catch {
                  $lastFailure = $_
                  Write-Verbose "PowerShell repository '$($repository.Name)' could not install Avm.Authoring $($release.Version); trying the next configured repository."
                }
              }
              if (-not $installed) { throw $lastFailure }
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
              Write-Warning "Avm.Authoring installation failed on attempt $attempt of ${maxAttempts}: $($_.Exception.Message). Retrying in $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          Import-Module Avm.Authoring

      - name: Create scoped module-list-sync token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AVM_APP_CLIENT_ID }}
          private-key: ${{ secrets.AVM_APP_PRIVATE_KEY }}
          owner: Azure
          repositories: bicep-registry-modules
          permission-contents: write
          permission-pull-requests: write

      - name: Sync module dropdown list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AVM_APP_BOT_LOGIN: ${{ vars.AVM_APP_BOT_LOGIN }}
          AVM_APP_BOT_USER_ID: ${{ vars.AVM_APP_BOT_USER_ID }}
          WHAT_IF: ${{ inputs.what_if }}
        run: |
          Import-Module Avm.Authoring -Force -ErrorAction Stop

          $whatIf = $env:WHAT_IF -eq 'true'
          Write-Output "What if: $whatIf"

          ./repository-management/module-list-sync/scripts/Invoke-AvmModuleListSync.ps1 `
            -Repository 'Azure/bicep-registry-modules' `
            -WhatIf:$whatIf

          $global:LASTEXITCODE = 0
