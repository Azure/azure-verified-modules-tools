name: 'Reusable: Bicep release'

on:
  workflow_call:
    inputs:
      authoringSource:
        description: Where to obtain the Avm.Authoring PowerShell module.
        type: string
        default: gallery
      authoringRef:
        description: 'Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag).'
        type: string
        default: ''

permissions: {}

jobs:
  bootstrap:
    name: Prepare authoring runtime
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'push' &&
        github.repository == 'Azure/bicep-registry-modules' &&
        github.ref == 'refs/heads/main'
      )
    permissions:
      contents: read
    uses: ./.github/workflows/authoring-bootstrap.yml
    with:
      authoringSource: ${{ inputs.authoringSource }}
      authoringRef: ${{ inputs.authoringRef }}

  initialize:
    name: Select pending module releases
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      needs.bootstrap.result == 'success' && (github.event_name == 'workflow_dispatch' || (
        github.event_name == 'push' &&
        github.repository == 'Azure/bicep-registry-modules' &&
        github.ref == 'refs/heads/main'
      ))
    outputs:
      moduleMatrix: ${{ steps.initialize.outputs.moduleMatrix }}
      hasModules: ${{ steps.initialize.outputs.hasModules }}
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download prepared authoring runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.bootstrap.outputs.artifact }}
          path: ${{ runner.temp }}/avm-authoring
      - name: Initialize release
        id: initialize
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_COMMIT: ${{ github.event.before }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          $capabilities = (Get-Module Avm.Authoring).PrivateData.AvmCapabilities
          if ($capabilities.BicepWorkflowOrchestration -isnot [int] -or $capabilities.BicepWorkflowOrchestration -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepWorkflowOrchestration = 1.'
          }
          $parameters = @{
            Root = $env:GITHUB_WORKSPACE
            EventName = $env:EVENT_NAME
            TargetCommit = $env:TARGET_COMMIT
            SkipModuleVersionCheck = $true
          }
          if ($env:EVENT_NAME -ceq 'push') { $parameters.BaseCommit = $env:BASE_COMMIT }
          $matrix = Initialize-AvmBicepReleaseMatrix @parameters
          $value = ConvertTo-Json -InputObject @{ include = @($matrix.Include | ForEach-Object {
                @{ modulePath = $_.ModulePath }
              }) } -Depth 20 -Compress
          "moduleMatrix=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "hasModules=$((@($matrix.Include).Count -gt 0).ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  release:
    name: Release [${{ matrix.modulePath }}]
    needs: [bootstrap, initialize]
    if: needs.initialize.outputs.hasModules == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.moduleMatrix) }}
    uses: ./.github/workflows/bicep-module-runtime-release.yml
    with:
      modulePath: ${{ matrix.modulePath }}
      targetCommit: ${{ github.sha }}
      pendingRelease: true
      requireChangelog: true
      requirePublishApproval: true
      authoringArtifact: ${{ needs.bootstrap.outputs.artifact }}
