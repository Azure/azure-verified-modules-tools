name: 'Reusable: Bicep release'

on:
  workflow_call:
    inputs:
      authoringSource:
        description: Where to obtain the Avm.Authoring PowerShell module.
        type: string
        default: gallery
      authoringRef:
        description: 'Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag).'
        type: string
        default: ''
      targetCommit:
        description: 'Manual retry target: full lowercase commit SHA on upstream main (blank = triggering SHA).'
        type: string
        default: ''
      baseCommit:
        description: 'Manual retry comparison base for a multi-commit push (blank = target first parent).'
        type: string
        default: ''
      initializeOnly:
        description: Return the selected module release plan without creating tags.
        type: boolean
        default: false
    outputs:
      moduleMatrix:
        description: Selected root modules and their planned release tags.
        value: ${{ jobs.initialize.outputs.moduleMatrix }}
      hasModules:
        description: Whether any root modules remain selected for release.
        value: ${{ jobs.initialize.outputs.hasModules }}
      baseCommit:
        description: Comparison base used to select pending release roots.
        value: ${{ jobs.initialize.outputs.baseCommit }}
      targetCommit:
        description: Validated release target commit.
        value: ${{ jobs.initialize.outputs.targetCommit }}
      authoringArtifact:
        description: Prepared authoring runtime artifact for per-module release jobs.
        value: ${{ jobs.bootstrap.outputs.artifact }}

permissions: {}

jobs:
  bootstrap:
    name: Prepare authoring runtime
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'push' &&
        github.repository == 'Azure/bicep-registry-modules' &&
        github.ref == 'refs/heads/main'
      )
    permissions:
      contents: read
    uses: ./.github/workflows/authoring-bootstrap.yml
    with:
      authoringSource: ${{ inputs.authoringSource }}
      authoringRef: ${{ inputs.authoringRef }}

  initialize:
    name: Select pending module releases
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      needs.bootstrap.result == 'success' && (github.event_name == 'workflow_dispatch' || (
        github.event_name == 'push' &&
        github.repository == 'Azure/bicep-registry-modules' &&
        github.ref == 'refs/heads/main'
      ))
    outputs:
      moduleMatrix: ${{ steps.initialize.outputs.moduleMatrix }}
      hasModules: ${{ steps.initialize.outputs.hasModules }}
      targetCommit: ${{ steps.target.outputs.sha }}
      baseCommit: ${{ steps.initialize.outputs.baseCommit }}
    steps:
      - name: Validate release target
        id: target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          REQUESTED_COMMIT: ${{ inputs.targetCommit }}
        with:
          script: |
            if (context.repo.owner !== 'Azure' || context.repo.repo !== 'bicep-registry-modules' ||
                context.ref !== 'refs/heads/main') {
              throw new Error('Release targets are restricted to upstream main.');
            }
            const requested = process.env.REQUESTED_COMMIT || '';
            if (requested && context.eventName !== 'workflow_dispatch') {
              throw new Error('targetCommit is only supported for manual releases.');
            }
            const target = requested || context.sha;
            if (!/^[0-9a-f]{40}$/.test(target)) {
              throw new Error('targetCommit must be a full lowercase SHA-1 commit identifier.');
            }
            const owner = 'Azure';
            const repo = 'bicep-registry-modules';
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const comparison = await github.rest.repos.compareCommits({
              owner, repo, base: target, head: main.data.commit.sha, per_page: 1
            });
            if (comparison.data.merge_base_commit.sha !== target) {
              throw new Error('targetCommit must be an ancestor of current upstream main.');
            }
            core.setOutput('sha', target);
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download prepared authoring runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.bootstrap.outputs.artifact }}
          path: ${{ runner.temp }}/avm-authoring
      - name: Initialize release
        id: initialize
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_COMMIT: ${{ github.event.before }}
          REQUESTED_BASE: ${{ inputs.baseCommit }}
          TARGET_COMMIT: ${{ steps.target.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          $capabilities = (Get-Module Avm.Authoring).PrivateData.AvmCapabilities
          if ($capabilities.BicepWorkflowOrchestration -isnot [int] -or $capabilities.BicepWorkflowOrchestration -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepWorkflowOrchestration = 1.'
          }
          if ($capabilities.BicepReleaseSelection -isnot [int] -or $capabilities.BicepReleaseSelection -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepReleaseSelection = 1.'
          }
          $parameters = @{
            Root = $env:GITHUB_WORKSPACE
            EventName = $env:EVENT_NAME
            TargetCommit = $env:TARGET_COMMIT
            SkipModuleVersionCheck = $true
          }
          if ($env:EVENT_NAME -ceq 'push') {
            if ($env:REQUESTED_BASE) { throw 'baseCommit is only supported for manual releases.' }
            $parameters.BaseCommit = $env:BASE_COMMIT
          }
          elseif ($env:REQUESTED_BASE) { $parameters.BaseCommit = $env:REQUESTED_BASE }
          $matrix = Initialize-AvmBicepReleaseMatrix @parameters
          Write-Output "Release selection: $($matrix.BaseCommit)..$env:TARGET_COMMIT"
          $releaseMatrix = [Collections.Generic.List[object]]::new()
          $summary = [Collections.Generic.List[string]]::new()
          if (@($matrix.Include).Count -eq 0) {
            $message = 'No pending publishable modules in the selected range.'
            Write-Output $message
            $null = $summary.Add($message)
          }
          else {
            $null = $summary.Add('| Module | Planned release tags |')
            $null = $summary.Add('| --- | --- |')
            foreach ($entry in $matrix.Include) {
              $planned = @(Set-AvmBicepReleaseTags -Root $env:GITHUB_WORKSPACE -ModulePath $entry.ModulePath `
                  -BaseCommit $matrix.BaseCommit -TargetCommit $env:TARGET_COMMIT -PendingRelease -WhatIf `
                  -SkipModuleVersionCheck)
              $tags = @($planned | ForEach-Object { $_.Tag })
              if ($tags.Count -eq 0) {
                $row = "| $($entry.ModulePath) | No pending release tags remain. |"
                Write-Output $row
                $null = $summary.Add($row)
                continue
              }
              $tagLabel = $tags -join ', '
              $null = $releaseMatrix.Add(@{
                  modulePath = $entry.ModulePath
                  plannedTags = ConvertTo-Json -InputObject $tags -Depth 20 -Compress
                  releaseTagLabel = $tagLabel
                })
              $row = "| $($entry.ModulePath) | $tagLabel |"
              Write-Output $row
              $null = $summary.Add($row)
            }
          }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
            throw 'The release selection summary file path is required.'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n") -Encoding utf8
          "baseCommit=$($matrix.BaseCommit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $value = ConvertTo-Json -InputObject @{ include = @($releaseMatrix) } -Depth 20 -Compress
          "moduleMatrix=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $hasModules = ($releaseMatrix.Count -gt 0).ToString().ToLowerInvariant()
          "hasModules=$hasModules" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  release:
    name: '${{ matrix.modulePath }}'
    needs: [bootstrap, initialize]
    if: ${{ !inputs.initializeOnly && needs.initialize.outputs.hasModules == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.moduleMatrix) }}
    uses: ./.github/workflows/bicep-module-runtime-release.yml
    with:
      modulePath: ${{ matrix.modulePath }}
      plannedTags: ${{ matrix.plannedTags }}
      releaseTagLabel: ${{ matrix.releaseTagLabel }}
      targetCommit: ${{ needs.initialize.outputs.targetCommit }}
      baseCommit: ${{ needs.initialize.outputs.baseCommit }}
      pendingRelease: true
      requireChangelog: true
      authoringArtifact: ${{ needs.bootstrap.outputs.artifact }}
