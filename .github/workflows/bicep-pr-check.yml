name: 'Reusable: Bicep PR check'

on:
  workflow_call:
    inputs:
      authoringSource:
        description: Where to obtain the Avm.Authoring PowerShell module.
        type: string
        default: gallery
      authoringRef:
        description: 'Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag).'
        type: string
        default: ''
      initializeOnly:
        description: Return the prepared module matrix for a caller-owned per-module workflow group.
        type: boolean
        default: false
    outputs:
      moduleMatrix:
        value: ${{ jobs.initialize.outputs.moduleMatrix }}
      hasModules:
        value: ${{ jobs.initialize.outputs.hasModules }}
      baseCommit:
        value: ${{ jobs.initialize.outputs.baseCommit }}
      targetCommit:
        value: ${{ jobs.initialize.outputs.targetCommit }}
      workflowInput:
        value: ${{ jobs.initialize.outputs.workflowInput }}
      authoringArtifact:
        value: ${{ jobs.bootstrap.outputs.artifact }}

permissions: {}

jobs:
  bootstrap:
    name: Prepare authoring runtime
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || (
        github.repository == 'Azure/bicep-registry-modules' &&
        github.event_name == 'pull_request' && (
          contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) ||
          (github.event.action == 'labeled' && github.event.label.name == 'PR: Run E2E Tests')
        )
      ))
    permissions:
      contents: read
    uses: ./.github/workflows/authoring-bootstrap.yml
    with:
      authoringSource: ${{ inputs.authoringSource }}
      authoringRef: ${{ inputs.authoringRef }}

  initialize:
    name: Select modules and test routes
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      !cancelled() && needs.bootstrap.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || (
        github.repository == 'Azure/bicep-registry-modules' &&
        github.event_name == 'pull_request' && (
          contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action) ||
          (github.event.action == 'labeled' && github.event.label.name == 'PR: Run E2E Tests')
        )
      ))
    outputs:
      baseCommit: ${{ steps.initialize.outputs.baseCommit }}
      targetCommit: ${{ steps.initialize.outputs.targetCommit }}
      workflowInput: ${{ steps.initialize.outputs.workflowInput }}
      moduleMatrix: ${{ steps.initialize.outputs.moduleMatrix }}
      hasModules: ${{ steps.initialize.outputs.hasModules }}
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download prepared authoring runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.bootstrap.outputs.artifact }}
          path: ${{ runner.temp }}/avm-authoring
      - name: Initialize checks
        id: initialize
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PULL_REQUEST_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          TARGET_COMMIT: ${{ github.sha }}
          MODULE_PATHS: ${{ github.event.inputs.modulePaths }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          $capabilities = (Get-Module Avm.Authoring).PrivateData.AvmCapabilities
          if ($capabilities.BicepWorkflowOrchestration -isnot [int] -or $capabilities.BicepWorkflowOrchestration -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepWorkflowOrchestration = 1.'
          }

          $fork = $env:EVENT_NAME -ceq 'pull_request' -and $env:HEAD_REPOSITORY -cne $env:REPOSITORY
          $labels = @(ConvertFrom-Json -InputObject $env:PR_LABELS)
          $deployment = $env:EVENT_NAME -ceq 'workflow_dispatch' -or (
            -not $fork -and $labels -ccontains 'PR: Run E2E Tests'
          )
          $parameters = @{
            Root = $env:GITHUB_WORKSPACE
            EventName = $env:EVENT_NAME
            TargetCommit = $env:TARGET_COMMIT
            PullRequestHeadCommit = $env:PULL_REQUEST_HEAD_COMMIT
            ModulePaths = $env:MODULE_PATHS
            StaticValidation = $true
            DeploymentValidation = $deployment
            RemoveDeployment = $true
            SkipModuleVersionCheck = $true
          }
          $outputs = Initialize-AvmBicepWorkflowMatrix @parameters
          $modules = [Collections.Generic.List[object]]::new()
          foreach ($entry in $outputs.ModuleMatrix.Include) {
            $record = [pscustomobject]@{
              modulePath = [string]$entry.ModulePath
              moduleTestFilePaths = ConvertTo-Json -InputObject @($entry.TestFiles) -Depth 20 -Compress
              psRuleModuleTestFilePaths = ConvertTo-Json -InputObject @($entry.PolicyTestFiles) -Depth 20 -Compress
              e2eRoute = 'none'
            }
            if (-not $fork -and $outputs.WorkflowInput.deploymentValidation -ceq 'true') {
              $record.e2eRoute = 'native'
            }
            $modules.Add($record)
          }
          $values = [ordered]@{
            baseCommit = $outputs.BaseCommit
            targetCommit = $outputs.TargetCommit
            workflowInput = ConvertTo-Json -InputObject $outputs.WorkflowInput -Depth 20 -Compress
            moduleMatrix = ConvertTo-Json -InputObject @{ include = @($modules) } -Depth 20 -Compress
            hasModules = ($modules.Count -gt 0).ToString().ToLowerInvariant()
          }
          foreach ($entry in $values.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

  check:
    name: '${{ matrix.modulePath }}'
    needs: [bootstrap, initialize]
    if: ${{ !inputs.initializeOnly && needs.initialize.outputs.hasModules == 'true' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.moduleMatrix) }}
    uses: ./.github/workflows/bicep-module-runtime.yml
    with:
      modulePath: ${{ matrix.modulePath }}
      moduleTestFilePaths: ${{ matrix.moduleTestFilePaths }}
      psRuleModuleTestFilePaths: ${{ matrix.psRuleModuleTestFilePaths }}
      e2eRoute: ${{ matrix.e2eRoute }}
      baseCommit: ${{ needs.initialize.outputs.baseCommit }}
      workflowInput: ${{ needs.initialize.outputs.workflowInput }}
      targetCommit: ${{ needs.initialize.outputs.targetCommit }}
      authoringArtifact: ${{ needs.bootstrap.outputs.artifact }}
    secrets: inherit
