---
name: 'Repos: Issue Routing'

# Design invariants -- do not regress these without a very good reason:
#  - schedule + workflow_dispatch only, never an `issues` trigger: this run
#    reads issue data with a privileged cross-repo app token.
#  - Offset crons ('9,24,39,54 * * * *' plus a daily '17 3 * * *' full-sweep
#    backstop) rather than a round-minute mark, because schedule runs are
#    best-effort and can be delayed or skipped near :00/:15/:30/:45.
on:
  schedule:
    - cron: '9,24,39,54 * * * *'
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      issue_url:
        description: 'Route a single issue (URL or number). Leave blank to sweep all open module issues.'
        default: ''
        type: string
      updated_within_minutes:
        description: 'Only sweep issues updated within the last N minutes. Use 0 for every open module issue.'
        default: '60'
        type: string
      what_if:
        description: 'Compute and log the routing decisions without calling gh issue edit/comment.'
        default: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: repository-management-issue-owner-routing
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  route:
    name: Route module issue owners
    if: github.repository == 'Azure/azure-verified-modules-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: avm
    steps:
      - name: Checkout trusted tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Avm.Authoring
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (-not @(Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet |
                  Where-Object { $_.Version -ge [version]'1.1.1' }).Count) {
                Install-Module -Name Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.1 `
                  -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
              }
              Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.1 -ErrorAction Stop
              $repositories = @(Get-PSResourceRepository -ErrorAction Stop)
              if (@($repositories | Where-Object { ([string]$_.Uri).TrimEnd('/') -ieq 'https://mcr.microsoft.com' }).Count -eq 0) {
                Register-PSResourceRepository -Name MAR -Uri 'https://mcr.microsoft.com/' -ApiVersion ContainerRegistry -Trusted -ErrorAction Stop
                $repositories = @(Get-PSResourceRepository -ErrorAction Stop)
              }
              $repositories = @($repositories | Sort-Object Priority, Name)
              if ($repositories.Count -eq 0) { throw [InvalidOperationException]::new('No PowerShell repositories are configured.') }
              $releases = [Collections.Generic.List[object]]::new()
              $lookupFailure = $null
              foreach ($repository in $repositories) {
                try {
                  foreach ($candidate in @(Find-PSResource -Name Avm.Authoring -Repository $repository.Name -ErrorAction Stop)) {
                    [version] $version = $null
                    if ([version]::TryParse([string]$candidate.Version, [ref]$version)) {
                      $releases.Add([pscustomobject]@{ Version = $version; Repository = $repository.Name })
                    }
                  }
                }
                catch {
                  $lookupFailure = $_
                  Write-Verbose "PowerShell repository '$($repository.Name)' could not find Avm.Authoring; trying the next configured repository."
                }
              }
              if ($releases.Count -eq 0) {
                if ($null -ne $lookupFailure) { throw $lookupFailure }
                throw [InvalidOperationException]::new('No stable Avm.Authoring package was found in the configured PowerShell repositories.')
              }
              $release = $null
              foreach ($candidate in $releases) {
                if ($null -eq $release -or $candidate.Version -gt $release.Version) { $release = $candidate }
              }
              $installed = $false
              foreach ($repository in $repositories) {
                if ($repository.Name -notin @($releases | Where-Object Version -EQ $release.Version | ForEach-Object Repository)) { continue }
                try {
                  Install-PSResource -Name Avm.Authoring -Version $release.Version.ToString() -Repository $repository.Name -Scope CurrentUser -TrustRepository -ErrorAction Stop
                  $installed = $true
                  break
                }
                catch {
                  $lastFailure = $_
                  Write-Verbose "PowerShell repository '$($repository.Name)' could not install Avm.Authoring $($release.Version); trying the next configured repository."
                }
              }
              if (-not $installed) { throw $lastFailure }
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
              Write-Warning "Avm.Authoring installation failed on attempt $attempt of ${maxAttempts}: $($_.Exception.Message). Retrying in $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          Import-Module Avm.Authoring

      - name: Create scoped issue routing token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AVM_APP_CLIENT_ID }}
          private-key: ${{ secrets.AVM_APP_PRIVATE_KEY }}
          owner: Azure
          repositories: bicep-registry-modules
          permission-issues: write

      - name: Route module issue owners
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          ISSUE_URL: ${{ inputs.issue_url }}
          UPDATED_WITHIN_MINUTES: ${{ inputs.updated_within_minutes }}
          WHAT_IF: ${{ inputs.what_if }}
        run: |
          Import-Module Avm.Authoring -Force -ErrorAction Stop

          $whatIf = $env:WHAT_IF -eq 'true'

          # workflow_dispatch has no `github.event.schedule`, so the lookback
          # comes from the dispatch input there. A `schedule` trigger has no
          # inputs (an empty UPDATED_WITHIN_MINUTES would otherwise cast to
          # 0, turning every cadence run into a full sweep) so the lookback
          # is mapped explicitly from the cron that fired, failing fast on
          # an unrecognized cron rather than silently defaulting.
          $updatedWithinMinutes = switch ($env:EVENT_NAME) {
            'workflow_dispatch' { [int]$env:UPDATED_WITHIN_MINUTES }
            'schedule' {
              switch ($env:EVENT_SCHEDULE) {
                '9,24,39,54 * * * *' { 60 }
                '17 3 * * *' { 0 }
                default { throw "Unexpected schedule '$($env:EVENT_SCHEDULE)' for the issue owner routing workflow." }
              }
            }
            default { throw "Unexpected event '$($env:EVENT_NAME)' triggered the issue owner routing workflow." }
          }

          Write-Output "Issue URL override: $($env:ISSUE_URL)"
          Write-Output "Updated within minutes: $updatedWithinMinutes"
          Write-Output "What if: $whatIf"

          ./repository-management/reviewer-routing/scripts/Invoke-AvmIssueOwnerRouting.ps1 `
            -Repository 'Azure/bicep-registry-modules' `
            -IssueUrl $env:ISSUE_URL `
            -UpdatedWithinMinutes $updatedWithinMinutes `
            -WhatIf:$whatIf

          $global:LASTEXITCODE = 0
