name: 'Reusable: Authoring bootstrap'

on:
  workflow_call:
    inputs:
      authoringSource:
        description: Where to obtain the Avm.Authoring PowerShell module.
        type: string
        default: gallery
      authoringRef:
        description: 'Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag).'
        type: string
        default: ''
      legacyVersion:
        type: string
        default: ''
    outputs:
      artifact:
        value: ${{ jobs.bootstrap.outputs.artifact }}

permissions:
  contents: read

jobs:
  bootstrap:
    name: Resolve and prepare Avm.Authoring
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.prepare.outputs.artifact }}
    steps:
      - name: Validate selection
        shell: pwsh
        env:
          SOURCE: ${{ inputs.authoringSource }}
          REF: ${{ inputs.authoringRef }}
          LEGACY_VERSION: ${{ inputs.legacyVersion }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE -cnotin @('gallery', 'repo')) {
            throw [ArgumentException]::new('authoringSource must be gallery or repo.')
          }
          if ($env:AVM_OFFLINE -eq '1') {
            throw [InvalidOperationException]::new('AVM_OFFLINE=1 prevents workflow authoring bootstrap.')
          }
          $ref = [string]$env:REF
          $legacyVersion = [string]$env:LEGACY_VERSION
          if ($env:EVENT_NAME -cne 'workflow_dispatch' -and
              ($env:SOURCE -cne 'gallery' -or $ref -cne '')) {
            throw [ArgumentException]::new('authoringSource and authoringRef overrides require manual dispatch.')
          }
          if ($legacyVersion -cne '' -and ($env:SOURCE -cne 'gallery' -or $ref -cne '')) {
            throw [ArgumentException]::new('avm-authoring-version cannot be combined with authoringSource or authoringRef overrides.')
          }
          if ($ref -match '[\x00-\x20\x7f]') {
            throw [ArgumentException]::new('authoringRef cannot contain whitespace or control characters.')
          }
          if ($env:SOURCE -ceq 'gallery' -and $ref -cne '' -and
              $ref -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw [ArgumentException]::new('Gallery authoringRef must be an exact stable version.')
          }
      - name: Resolve repository commit
        if: inputs.authoringSource == 'repo'
        id: repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          AUTHORING_REF: ${{ inputs.authoringRef }}
        with:
          script: |
            const owner = 'Azure';
            const repo = 'azure-verified-modules-tools';
            let ref = process.env.AUTHORING_REF;
            let selectedSha;
            if (!ref) {
              const tags = await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 });
              const stable = tags.map(tag => {
                const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag.name);
                return match && { name: tag.name, sha: tag.commit.sha, version: match.slice(1).map(BigInt) };
              }).filter(Boolean);
              stable.sort((a, b) => {
                for (let i = 0; i < 3; i++) {
                  if (a.version[i] !== b.version[i]) return a.version[i] > b.version[i] ? -1 : 1;
                }
                return 0;
              });
              if (!stable.length) throw new Error('No stable repository version tag was found.');
              ref = stable[0].name;
              selectedSha = stable[0].sha;
            }
            if (!/^[0-9a-fA-F]{40}$/.test(ref) &&
                (ref === '@' || /[\x00-\x20\x7f~^:?*[\]\\]/.test(ref) ||
                 ref.includes('..') || ref.includes('@{') || ref.startsWith('/') ||
                 ref.endsWith('/') || ref.endsWith('.') ||
                 ref.split('/').some(part => !part || part.startsWith('.') || part.endsWith('.lock')))) {
              throw new Error('Invalid repository authoringRef.');
            }
            const commit = await github.rest.repos.getCommit({ owner, repo, ref: selectedSha || ref });
            const sha = commit.data.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Repository ref did not resolve to a full commit SHA.');
            if (selectedSha && sha !== selectedSha) throw new Error('Selected tag commit changed during resolution.');
            core.info(`Selected repository ref ${ref}, commit ${sha}.`);
            core.setOutput('sha', sha);
            core.setOutput('ref', ref);
      - name: Check out selected tools commit
        if: inputs.authoringSource == 'repo'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Azure/azure-verified-modules-tools
          ref: ${{ steps.repository.outputs.sha }}
          path: authoring-source
          persist-credentials: false
      - name: Prepare module
        id: prepare
        shell: pwsh
        env:
          SOURCE: ${{ inputs.authoringSource }}
          REF: ${{ inputs.authoringRef }}
          LEGACY_VERSION: ${{ inputs.legacyVersion }}
          RESOLVED_REF: ${{ steps.repository.outputs.ref }}
          RESOLVED_SHA: ${{ steps.repository.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'avm-package'
          $moduleRoot = Join-Path $packageRoot 'Avm.Authoring'
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          if ($env:SOURCE -ceq 'repo') {
            if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
              Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
            }
            Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
            if (-not (Get-Module -ListAvailable -Name InvokeBuild | Where-Object { $_.Version -ge [version]'5.11.0' })) {
              $repositories = @(Get-PSResourceRepository -ErrorAction Stop | Sort-Object Priority, Name)
              if ($repositories.Count -eq 0) { throw [InvalidOperationException]::new('No PowerShell repositories are configured.') }
              $installed = $false
              foreach ($repository in $repositories) {
                try {
                  Install-PSResource -Name InvokeBuild -Version '[5.11.0,)' -Repository $repository.Name -Scope CurrentUser -TrustRepository -ErrorAction Stop
                  $installed = $true
                  break
                }
                catch {
                  $lastFailure = $_
                  Write-Verbose "PowerShell repository '$($repository.Name)' could not install InvokeBuild; trying the next configured repository."
                }
              }
              if (-not $installed) { throw $lastFailure }
            }
            $source = Join-Path $env:GITHUB_WORKSPACE 'authoring-source'
            & (Join-Path $source 'build.ps1') build
            $built = Join-Path $source 'out' 'Avm.Authoring'
            if (-not (Test-Path -LiteralPath (Join-Path $built 'Avm.Authoring.psd1') -PathType Leaf)) {
              throw [IO.FileNotFoundException]::new('The repository build did not produce the Avm.Authoring manifest.')
            }
            Copy-Item -LiteralPath $built -Destination $moduleRoot -Recurse
          }
          else {
            $selection = if (-not [string]::IsNullOrEmpty($env:REF)) { $env:REF } else { [string]$env:LEGACY_VERSION }
            $find = @{ Name = 'Avm.Authoring'; ErrorAction = 'Stop' }
            if ($selection -cne '') { $find.Version = $selection }
            $release = $null
            for ($resourceAttempt = 1; $resourceAttempt -le 3; $resourceAttempt++) {
              try {
                if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
                  Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
                }
                Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
                break
              }
              catch {
                if ($resourceAttempt -eq 3) { throw }
                $delay = 5 * [math]::Pow(2, $resourceAttempt - 1)
                Write-Warning "PSResourceGet preparation failed on attempt $resourceAttempt of 3: $($_.Exception.Message). Retrying in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }
            $repositories = @(Get-PSResourceRepository -ErrorAction Stop | Sort-Object Priority, Name)
            if ($repositories.Count -eq 0) { throw [InvalidOperationException]::new('No PowerShell repositories are configured.') }
            $saved = $false
            foreach ($repository in $repositories) {
              try {
                $find.Repository = $repository.Name
                for ($attempt = 1; $attempt -le 3; $attempt++) {
                  try {
                    if ($null -eq $release) {
                      $found = @(Find-PSResource @find | Sort-Object Version -Descending | Select-Object -First 1)
                      if ($found.Count -ne 1) { throw [InvalidOperationException]::new('No matching Gallery release was found.') }
                      $release = $found[0]
                    }
                    if (-not [string]::IsNullOrEmpty($env:REF) -and $release.Version.ToString() -cne $env:REF) {
                      throw [InvalidOperationException]::new('The Gallery release does not match the requested exact version.')
                    }
                    $savePath = Join-Path $env:RUNNER_TEMP "avm-gallery-$([guid]::NewGuid().ToString('N'))"
                    New-Item -ItemType Directory -Path $savePath -Force | Out-Null
                    Save-PSResource -Name Avm.Authoring -Version $release.Version.ToString() -Repository $repository.Name `
                      -Path $savePath -TrustRepository -ErrorAction Stop
                    break
                  }
                  catch {
                    if ($attempt -eq 3) { throw }
                    $delay = 5 * [math]::Pow(2, $attempt - 1)
                    Write-Warning "Avm.Authoring installation failed on attempt $attempt of 3: $($_.Exception.Message). Retrying in $delay seconds."
                    Start-Sleep -Seconds $delay
                  }
                }
                $saved = $true
                break
              }
              catch {
                $lastFailure = $_
                Write-Verbose "PowerShell repository '$($repository.Name)' could not prepare Avm.Authoring; trying the next configured repository."
              }
            }
            if (-not $saved) { throw $lastFailure }
            $manifests = @(Get-ChildItem -LiteralPath $savePath -Filter 'Avm.Authoring.psd1' -Recurse -File)
            if ($manifests.Count -ne 1) {
              throw [InvalidOperationException]::new('Gallery download must contain exactly one Avm.Authoring manifest.')
            }
            Copy-Item -LiteralPath $manifests[0].Directory.FullName -Destination $moduleRoot -Recurse
          }
          $manifest = Join-Path $moduleRoot 'Avm.Authoring.psd1'
          $module = Import-Module -Name $manifest -PassThru -ErrorAction Stop
          if ($module.Name -cne 'Avm.Authoring') {
            throw [InvalidOperationException]::new('The prepared module has an unexpected identity.')
          }
          if ($env:SOURCE -ceq 'gallery' -and $module.Version.ToString() -cne $release.Version.ToString()) {
            throw [InvalidOperationException]::new('The Gallery module version does not match the selected release.')
          }
          $selectedRef = if ($env:SOURCE -ceq 'repo') { $env:RESOLVED_REF } else { $selection }
          $selectedRef = [regex]::Replace([string]$selectedRef, '[\x00-\x1f\x7f]', '?')
          Write-Host "Selected authoring source $($env:SOURCE), version $($module.Version), ref $selectedRef, SHA $($env:RESOLVED_SHA)."
          $artifact = "avm-authoring-$([guid]::NewGuid().ToString('N'))"
          "artifact=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload prepared module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/avm-package/Avm.Authoring
          if-no-files-found: error
          include-hidden-files: true
