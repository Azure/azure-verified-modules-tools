name: 'Authoring: Release'

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published full release tag (vMAJOR.MINOR.PATCH); leave blank to publish all ready releases
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: psgallery
  cancel-in-progress: false

jobs:
  publish:
    name: Publish MAR releases to PSGallery
    if: github.repository == 'Azure/azure-verified-modules-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: psgallery

    steps:
      # The release tag controls the artifact, never the code that receives the Gallery key.
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Find full releases ready to publish
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Get-AvmAuthoringGalleryPlan.ps1 -ReleaseTag $env:RELEASE_TAG

      - name: Download signed modules from MCR
        if: steps.plan.outputs.tags != ''
        shell: pwsh
        env:
          RELEASE_TAGS: ${{ steps.plan.outputs.tags }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.2.0
          Register-PSResourceRepository -Name AvmMcr -Uri 'https://mcr.microsoft.com' -ApiVersion ContainerRegistry -Trusted
          foreach ($tag in $env:RELEASE_TAGS.Split(',')) {
              $version = $tag.Substring(1)
              $directory = New-Item -ItemType Directory -Path "./out/release/$tag"
              $download = New-Item -ItemType Directory -Path "./out/mcr/$tag"
              Save-PSResource -Name Avm.Authoring -Version $version -Repository AvmMcr -Path $download.FullName -SkipDependencyCheck
              Move-Item -LiteralPath "$download/Avm.Authoring/$version" -Destination "$directory/Avm.Authoring"

              # Keep the existing publisher's archive validation without uploading any GitHub assets.
              $archive = "Avm.Authoring-$version.zip"
              [IO.Compression.ZipFile]::CreateFromDirectory("$directory/Avm.Authoring", "$directory/$archive", 'Optimal', $true)
              $hash = (Get-FileHash -LiteralPath "$directory/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$archive" | Set-Content -LiteralPath "$directory/SHA256SUMS"
          }

      - name: Validate and publish signed module
        if: steps.plan.outputs.tags != ''
        shell: pwsh
        env:
          RELEASE_TAGS: ${{ steps.plan.outputs.tags }}
          POWERSHELL_GALLERY_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:POWERSHELL_GALLERY_API_KEY)) {
              throw 'POWERSHELL_GALLERY_API_KEY is not configured.'
          }

          $apiKey = ConvertTo-SecureString `
              -String $env:POWERSHELL_GALLERY_API_KEY `
              -AsPlainText `
              -Force
          foreach ($tag in $env:RELEASE_TAGS.Split(',')) {
              ./scripts/Publish-AvmAuthoring.ps1 `
                  -ReleaseTag $tag `
                  -ArtifactPath "./out/release/$tag" `
                  -ApiKey $apiKey `
                  -SkipIfAlreadyPublished `
                  -Confirm:$false
          }
