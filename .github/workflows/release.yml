name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0). Must follow vX.Y.Z.'
        required: true

permissions:
  contents: write   # required to create the GitHub Release

concurrency:
  # Releases are point-in-time and must never race; never cancel an in-flight
  # release just because someone re-pushed the tag.
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Configure a `psgallery` environment in repo Settings → Environments with
    # required reviewers to gate publishes behind a manual approval. The
    # POWERSHELL_GALLERY_API_KEY secret may live at repo or environment scope;
    # the publish step refuses to run if it is not present.
    environment: psgallery

    steps:
      - name: Resolve release tag
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Tag '$tag' does not match the expected stable-release pattern 'vX.Y.Z'. Prerelease tags (e.g. v0.1.0-preview.1) are not supported by this workflow yet."
          }
          $version = $tag -replace '^v', ''

          # A dispatch run names a tag that may not exist yet. Fail here with a
          # clear message instead of letting the checkout step fail obscurely.
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>$null
              if ($LASTEXITCODE -ne 0) {
                  throw "Tag '$tag' does not exist in $env:GITHUB_REPOSITORY. Publish the GitHub Release (which creates the tag) or push the tag first, then re-run this workflow."
              }
          }

          Write-Host "Releasing Avm.Authoring $version (tag $tag)"
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.ver.outputs.tag }}
          persist-credentials: false

      - name: Install build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name 'Microsoft.PowerShell.PSResourceGet')) {
              Install-Module -Name 'Microsoft.PowerShell.PSResourceGet' -Scope CurrentUser -Force -AllowClobber
          }
          Import-Module 'Microsoft.PowerShell.PSResourceGet' -Force
          foreach ($pkg in @(
              @{ Name = 'InvokeBuild';      Version = '[5.11.0,)' },
              @{ Name = 'Pester';           Version = '[5.5.0,)'  },
              @{ Name = 'PSScriptAnalyzer'; Version = '[1.21.0,)' }
          )) {
              Install-PSResource @pkg -Scope CurrentUser -TrustRepository
          }

      - name: Run ci gate
        shell: pwsh
        run: ./build.ps1 ci

      - name: Build staged module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.ver.outputs.version }}'

          # The tag drives the published version: `build` stamps it into the
          # staged manifest under out/, leaving the in-repo manifest untouched.
          ./build.ps1 build -ReleaseVersion $version

          $staged = (Test-ModuleManifest -Path ./out/Avm.Authoring/Avm.Authoring.psd1).Version.ToString()
          if ($staged -ne $version) {
              throw "Staged manifest version '$staged' does not match tag version '$version'. Version stamping in build/avm.build.ps1 did not take effect."
          }
          Write-Host "Staged Avm.Authoring $staged"

      - name: Package release artefacts
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.ver.outputs.version }}'
          $stage   = './out/Avm.Authoring'
          $zipName = "Avm.Authoring-$version.zip"
          $zipPath = "./out/$zipName"

          # Zip the staged module folder so the archive root is "Avm.Authoring/...".
          Compress-Archive -Path $stage -DestinationPath $zipPath -Force

          $hash    = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLower()
          $sumLine = "$hash *$zipName"
          $sumPath = './out/SHA256SUMS'
          # LF + no trailing newline keeps the sums file diffable.
          [System.IO.File]::WriteAllText(
              (Resolve-Path -LiteralPath './out').Path + [IO.Path]::DirectorySeparatorChar + 'SHA256SUMS',
              "$sumLine`n",
              (New-Object System.Text.UTF8Encoding $false))

          Write-Host "Packaged $zipPath"
          Write-Host "SHA256:   $hash"

          "zip=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sums=$sumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Resolve release notes
        id: notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.ver.outputs.version }}'

          # A CHANGELOG section is a bonus, not a gate. Releases are usually cut
          # from the GitHub UI, which already authors a body; without a section
          # the release falls back to GitHub's auto-generated notes.
          $notes = & ./scripts/Get-AvmReleaseNotes.ps1 -Version $version -AllowMissing
          $notesText = ($notes | Out-String).Trim()

          if ($notesText) {
              [System.IO.File]::WriteAllText(
                  (Join-Path (Resolve-Path -LiteralPath './out').Path 'RELEASE_NOTES.md'),
                  "$notesText`n",
                  (New-Object System.Text.UTF8Encoding $false))
              Write-Host "Using the CHANGELOG section for $version as the release body."
              "path=./out/RELEASE_NOTES.md" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "has_notes=true"              | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
              Write-Host "::notice::No CHANGELOG section for $version; the release body will use GitHub's auto-generated notes."
              "path="           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "has_notes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          POWERSHELL_GALLERY_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:POWERSHELL_GALLERY_API_KEY)) {
              throw 'POWERSHELL_GALLERY_API_KEY secret is not set. Configure it as a repository secret or on the `psgallery` GitHub Environment.'
          }
          # Publish-AvmAuthoring.ps1 accepts -ApiKey as [SecureString] only
          # (spec section 17). Convert the CI secret at the call site; the script
          # converts back to a plain string internally, inside its ShouldProcess
          # branch, for the smallest possible plain-text window.
          $secureKey = ConvertTo-SecureString -String $env:POWERSHELL_GALLERY_API_KEY -AsPlainText -Force
          ./scripts/Publish-AvmAuthoring.ps1 `
              -ApiKey $secureKey `
              -ModulePath ./out/Avm.Authoring `
              -SkipIfAlreadyPublished `
              -Confirm:$false

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES: ${{ steps.notes.outputs.path }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
          ZIP: ${{ steps.pkg.outputs.zip }}
          SUMS: ${{ steps.pkg.outputs.sums }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          # Idempotent / re-runnable: only *create* the release when the tag has
          # no release yet. If one already exists -- the common case, since
          # releases are cut from the GitHub UI -- leave the body untouched and
          # just (re)upload the artefacts with --clobber.
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $env:TAG already exists; uploading artefacts only (release notes left untouched)."
              gh release upload $env:TAG $env:ZIP $env:SUMS --clobber
          }
          elseif ($env:HAS_NOTES -eq 'true') {
              Write-Host "Creating release $env:TAG from the CHANGELOG section."
              gh release create $env:TAG --title "Avm.Authoring $env:VERSION" --notes-file $env:NOTES --verify-tag $env:ZIP $env:SUMS
          }
          else {
              Write-Host "Creating release $env:TAG with auto-generated notes."
              gh release create $env:TAG --title "Avm.Authoring $env:VERSION" --generate-notes --verify-tag $env:ZIP $env:SUMS
          }

          if ($LASTEXITCODE -ne 0) {
              throw "The gh release command failed with exit code $LASTEXITCODE."
          }
