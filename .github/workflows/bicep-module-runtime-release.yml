name: 'Reusable: Bicep Module Runtime Release'

on:
  workflow_call:
    inputs:
      modulePath:
        type: string
        required: true
      targetCommit:
        type: string
        required: true
      pendingRelease:
        type: boolean
        required: false
        default: false
      requireChangelog:
        type: boolean
        required: false
        default: false
      requirePublishApproval:
        type: boolean
        required: false
        default: false
      authoringArtifact:
        type: string
        default: ''

permissions: {}

jobs:
  approval:
    name: Approve release tag creation
    environment: publish-approval
    runs-on: ubuntu-latest
    permissions: {}
    if: inputs.requirePublishApproval && github.ref == 'refs/heads/main' && github.repository == 'Azure/bicep-registry-modules'
    steps:
      - name: Record approval
        shell: pwsh
        run: Write-Output 'Release tag creation approved.'

  release:
    name: Create release tags
    needs: approval
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AVM_AUTHORING_MODULE: Avm.Authoring
    concurrency:
      group: avm-publish-${{ inputs.modulePath }}
      queue: max
    if: |
      !cancelled() &&
      (!inputs.requirePublishApproval || needs.approval.result == 'success') &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Azure/bicep-registry-modules'
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.targetCommit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download prepared authoring runtime
        if: inputs.authoringArtifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.authoringArtifact }}
          path: ${{ runner.temp }}/avm-authoring
      - name: Select prepared authoring runtime
        if: inputs.authoringArtifact != ''
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Prepared Avm.Authoring manifest is missing.' }
          "AVM_AUTHORING_MODULE=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create module release tags
        shell: pwsh
        env:
          MODULE_PATH: ${{ inputs.modulePath }}
          TARGET_COMMIT: ${{ inputs.targetCommit }}
          PENDING_RELEASE: ${{ inputs.pendingRelease }}
          REQUIRE_CHANGELOG: ${{ inputs.requireChangelog }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AVM_AUTHORING_MODULE -eq 'Avm.Authoring') {
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (-not @(Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet |
                  Where-Object { $_.Version -ge [version]'1.1.1' }).Count) {
                Install-Module -Name Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.1.1 `
                  -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
              }
              Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
              $repositories = @(Get-PSResourceRepository -ErrorAction Stop)
              if (@($repositories | Where-Object { ([string]$_.Uri).TrimEnd('/') -ieq 'https://mcr.microsoft.com' }).Count -eq 0) {
                Register-PSResourceRepository -Name MAR -Uri 'https://mcr.microsoft.com/' -ApiVersion ContainerRegistry -Trusted -ErrorAction Stop
                $repositories = @(Get-PSResourceRepository -ErrorAction Stop)
              }
              $repositories = @($repositories | Sort-Object Priority, Name)
              if ($repositories.Count -eq 0) { throw [InvalidOperationException]::new('No PowerShell repositories are configured.') }
              $releases = [Collections.Generic.List[object]]::new()
              $lookupFailure = $null
              foreach ($repository in $repositories) {
                try {
                  foreach ($candidate in @(Find-PSResource -Name Avm.Authoring -Repository $repository.Name -ErrorAction Stop)) {
                    [version] $version = $null
                    if ([version]::TryParse([string]$candidate.Version, [ref]$version)) {
                      $releases.Add([pscustomobject]@{ Version = $version; Repository = $repository.Name })
                    }
                  }
                }
                catch {
                  $lookupFailure = $_
                  Write-Verbose "PowerShell repository '$($repository.Name)' could not find Avm.Authoring; trying the next configured repository."
                }
              }
              if ($releases.Count -eq 0) {
                if ($null -ne $lookupFailure) { throw $lookupFailure }
                throw [InvalidOperationException]::new('No stable Avm.Authoring package was found in the configured PowerShell repositories.')
              }
              $release = $null
              foreach ($candidate in $releases) {
                if ($null -eq $release -or $candidate.Version -gt $release.Version) { $release = $candidate }
              }
              $installed = $false
              foreach ($repository in $repositories) {
                if ($repository.Name -notin @($releases | Where-Object Version -EQ $release.Version | ForEach-Object Repository)) { continue }
                try {
                  Install-PSResource -Name Avm.Authoring -Version $release.Version.ToString() -Repository $repository.Name -Scope CurrentUser -TrustRepository -ErrorAction Stop
                  $installed = $true
                  break
                }
                catch {
                  $lastFailure = $_
                  Write-Verbose "PowerShell repository '$($repository.Name)' could not install Avm.Authoring $($release.Version); trying the next configured repository."
                }
              }
              if (-not $installed) { throw $lastFailure }
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) { throw }
              $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
              Write-Warning "Avm.Authoring installation failed on attempt $attempt of ${maxAttempts}: $($_.Exception.Message). Retrying in $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          }
          Import-Module $env:AVM_AUTHORING_MODULE -ErrorAction Stop
          $capabilities = (Get-Module Avm.Authoring).PrivateData.AvmCapabilities
          if ($capabilities.BicepWorkflowOrchestration -isnot [int] -or $capabilities.BicepWorkflowOrchestration -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepWorkflowOrchestration = 1.'
          }
          $tags = @(Set-AvmBicepReleaseTags -Root $env:GITHUB_WORKSPACE -ModulePath $env:MODULE_PATH `
              -TargetCommit $env:TARGET_COMMIT -PendingRelease:([bool]::Parse($env:PENDING_RELEASE)) `
              -RequireChangelog:([bool]::Parse($env:REQUIRE_CHANGELOG)) -SkipModuleVersionCheck -Confirm:$false)
          if ($tags.Count -eq 0) { Write-Output 'No publishable module changes were found.' }
          foreach ($tag in $tags) { Write-Output "$($tag.Tag): created=$($tag.Created), reused=$($tag.Reused)" }
