name: 'Reusable: Bicep Module Runtime Deployment'

on:
  workflow_call:
    inputs:
      modulePath:
        type: string
        required: true
      workflowInput:
        type: string
        required: true
      testCase:
        type: string
        required: true
      targetCommit:
        type: string
        required: true
      authoringArtifact:
        type: string
        default: ''

permissions: {}

jobs:
  deploy:
    name: Deploy [${{ fromJSON(inputs.testCase).Name }}] on [${{ fromJSON(inputs.testCase).SubscriptionName }}]
    environment: avm-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AVM_AUTHORING_MODULE: Avm.Authoring
    concurrency:
      group: ${{ fromJSON(inputs.testCase).ConcurrencyGroup }}
      queue: max
    steps:
      - name: Report skipped deployment
        if: fromJSON(inputs.testCase).E2eIgnore
        shell: pwsh
        run: Write-Output 'Deployment skipped because .e2eignore is set.'
      - name: Check out caller
        if: ${{ !fromJSON(inputs.testCase).E2eIgnore }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.targetCommit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download prepared authoring runtime
        if: ${{ !fromJSON(inputs.testCase).E2eIgnore && inputs.authoringArtifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.authoringArtifact }}
          path: ${{ runner.temp }}/avm-authoring
      - name: Select prepared authoring runtime
        if: ${{ !fromJSON(inputs.testCase).E2eIgnore && inputs.authoringArtifact != '' }}
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Prepared Avm.Authoring manifest is missing.' }
          "AVM_AUTHORING_MODULE=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Initialize deployment context
        id: context
        if: ${{ !fromJSON(inputs.testCase).E2eIgnore }}
        shell: pwsh
        env:
          MODULE_PATH: ${{ inputs.modulePath }}
          TEST_CASE: ${{ inputs.testCase }}
          TEST_SUBSCRIPTION_IDS: ${{ vars.VALIDATE_SUBSCRIPTION_IDS || vars.TEST_SUBSCRIPTION_IDS || secrets.VALIDATE_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          VALIDATE_SUBSCRIPTION_ID: ${{ vars.VALIDATE_SUBSCRIPTION_ID || secrets.VALIDATE_SUBSCRIPTION_ID }}
          VALIDATE_MODULE_CLIENT_IDS: ${{ vars.VALIDATE_MODULE_CLIENT_IDS }}
          VALIDATE_MODULE_SUBSCRIPTION_CLEANUP_MANAGEMENT_GROUP_IDS: ${{ vars.VALIDATE_MODULE_SUBSCRIPTION_CLEANUP_MANAGEMENT_GROUP_IDS }}
          VALIDATE_TENANT_ID: ${{ vars.VALIDATE_TENANT_ID || secrets.VALIDATE_TENANT_ID }}
          TOKEN_NAMEPREFIX: ${{ secrets.TOKEN_NAMEPREFIX }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AVM_AUTHORING_MODULE -eq 'Avm.Authoring') {
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
                Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
              }
              Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
              Install-PSResource -Name Avm.Authoring -Scope CurrentUser -TrustRepository -ErrorAction Stop
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) { throw }
              $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
              Write-Warning "Avm.Authoring installation failed on attempt $attempt of ${maxAttempts}: $($_.Exception.Message). Retrying in $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          }
          Import-Module $env:AVM_AUTHORING_MODULE -ErrorAction Stop
          if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
                break
              }
              catch {
                if ($attempt -eq 3) { throw }
                $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
                Write-Warning "PSResourceGet installation failed on attempt $attempt of 3: $($_.Exception.Message). Retrying in $delaySeconds seconds."
                Start-Sleep -Seconds $delaySeconds
              }
            }
          }
          Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
          $capabilities = (Get-Module Avm.Authoring).PrivateData.AvmCapabilities
          if ($capabilities.BicepWorkflowE2eRuntime -isnot [int] -or $capabilities.BicepWorkflowE2eRuntime -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepWorkflowE2eRuntime = 1.'
          }
          if ($capabilities.BicepAzureDependencyInventory -isnot [int] -or $capabilities.BicepAzureDependencyInventory -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepAzureDependencyInventory = 1.'
          }
          foreach ($dependency in Get-AvmBicepAzureDependency -SkipModuleVersionCheck) {
            $available = @(Get-Module -ListAvailable -Name $dependency.Name | Where-Object { $_.Version -ge $dependency.MinimumVersion })
            if ($available.Count -gt 0) { continue }
            if ($env:AVM_OFFLINE -eq '1') { throw "AVM_OFFLINE=1 prevents installing $($dependency.Name)." }
            $repository = Get-PSResourceRepository -Name PSGallery -ErrorAction Stop
            if ([string]$repository.Uri -cne 'https://www.powershellgallery.com/api/v2') {
              throw 'PSGallery must use the official HTTPS repository.'
            }
            for ($dependencyAttempt = 1; $dependencyAttempt -le 3; $dependencyAttempt++) {
              try {
                $available = @(Get-Module -ListAvailable -Name $dependency.Name | Where-Object { $_.Version -ge $dependency.MinimumVersion })
                if ($available.Count -eq 0) {
                  Install-PSResource -Name $dependency.Name -Version $dependency.MinimumVersion.ToString() `
                    -Repository PSGallery -Scope CurrentUser -TrustRepository -Quiet -ErrorAction Stop
                }
                $available = @(Get-Module -ListAvailable -Name $dependency.Name | Where-Object { $_.Version -ge $dependency.MinimumVersion })
                if ($available.Count -eq 0) { throw "Installation did not provide $($dependency.Name) $($dependency.MinimumVersion) or newer." }
                break
              }
              catch {
                if ($dependencyAttempt -eq 3 -or $_.Exception.ToString() -notmatch '(?i)(timed? out|connection (reset|refused)|temporary failure|temporarily unavailable|\b429\b|\b50[234]\b|no route to host|name or service not known)') { throw }
                Write-Warning "Installing $($dependency.Name) failed transiently (attempt $dependencyAttempt of 3); checking installed state before retry."
                Start-Sleep -Seconds (5 * [math]::Pow(2, $dependencyAttempt - 1))
              }
            }
          }
          $testCase = ConvertFrom-Json -InputObject $env:TEST_CASE -AsHashtable
          $context = Get-AvmBicepE2eTestContext -Root $env:GITHUB_WORKSPACE -ModulePath $env:MODULE_PATH `
              -TestCase $testCase -PoolJson $env:TEST_SUBSCRIPTION_IDS -FallbackSubscriptionId $env:VALIDATE_SUBSCRIPTION_ID `
              -ModuleClientIds $env:VALIDATE_MODULE_CLIENT_IDS -TenantId $env:VALIDATE_TENANT_ID `
              -ModuleSubscriptionCleanupManagementGroupIds $env:VALIDATE_MODULE_SUBSCRIPTION_CLEANUP_MANAGEMENT_GROUP_IDS `
              -NamePrefix $env:TOKEN_NAMEPREFIX -SkipModuleVersionCheck
          foreach ($property in $context.PSObject.Properties) {
            "$($property.Name)=$($property.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Sign in with OIDC
        if: ${{ !fromJSON(inputs.testCase).E2eIgnore }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ steps.context.outputs.ClientId }}
          tenant-id: ${{ steps.context.outputs.TenantId }}
          subscription-id: ${{ steps.context.outputs.SubscriptionId }}
          enable-AzPSSession: true
      - name: Deploy native test case
        id: deploy
        if: ${{ !fromJSON(inputs.testCase).E2eIgnore }}
        shell: pwsh
        env:
          MODULE_PATH: ${{ steps.context.outputs.ModulePath }}
          EXAMPLE: ${{ steps.context.outputs.Example }}
          SUBSCRIPTION_ID: ${{ steps.context.outputs.SubscriptionId }}
          TENANT_ID: ${{ steps.context.outputs.TenantId }}
          REQUIRE_ISOLATION: ${{ steps.context.outputs.RequireResourceIsolation }}
          METADATA_LOCATION: WestEurope
          RESOURCE_GROUP_PREFIX: avm
          RESOURCE_LOCATION: ${{ fromJSON(inputs.workflowInput).customLocation }}
          SUBSCRIPTION_CLEANUP_MANAGEMENT_GROUP_ID: ${{ steps.context.outputs.SubscriptionCleanupManagementGroupId }}
          AVM_CI_VARIABLES: ${{ toJSON(vars) }}
          AVM_CI_SECRETS: ${{ toJSON(secrets) }}
          STATE_PATH: ${{ runner.temp }}/avm-bicep-state/${{ steps.context.outputs.ArtifactKey }}.cleanup.json
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module $env:AVM_AUTHORING_MODULE -ErrorAction Stop
          $null = New-Item -ItemType Directory -Path (Split-Path $env:STATE_PATH) -Force
          Set-Location (Join-Path $env:GITHUB_WORKSPACE $env:MODULE_PATH)
          $arguments = @(
            'test', 'e2e', '--ecosystem', 'bicep', '--example', $env:EXAMPLE, '--recurse',
            '--subscription-id', $env:SUBSCRIPTION_ID, '--tenant-id', $env:TENANT_ID, '--phase', 'Deploy',
            '--cleanup-state-path', $env:STATE_PATH, '--location', $env:METADATA_LOCATION,
            '--resource-group-prefix', $env:RESOURCE_GROUP_PREFIX, '--use-ci-inputs',
            "--require-resource-isolation=$($env:REQUIRE_ISOLATION)", '--confirm=false'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:RESOURCE_LOCATION)) {
            $arguments += '--resource-location', $env:RESOURCE_LOCATION
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SUBSCRIPTION_CLEANUP_MANAGEMENT_GROUP_ID)) {
            $arguments += '--subscription-cleanup-management-group-id', $env:SUBSCRIPTION_CLEANUP_MANAGEMENT_GROUP_ID
          }
          avm -SkipModuleVersionCheck @arguments
      - name: Renew OIDC sign-in for completion
        id: renew_oidc
        if: ${{ !cancelled() && (success() || failure()) && steps.deploy.outcome != 'skipped' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ steps.context.outputs.ClientId }}
          tenant-id: ${{ steps.context.outputs.TenantId }}
          subscription-id: ${{ steps.context.outputs.SubscriptionId }}
          enable-AzPSSession: true
      - name: Assert and complete native test case
        if: ${{ !cancelled() && (success() || failure()) && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') && steps.renew_oidc.outcome == 'success' }}
        shell: pwsh
        env:
          MODULE_PATH: ${{ steps.context.outputs.ModulePath }}
          SUBSCRIPTION_ID: ${{ steps.context.outputs.SubscriptionId }}
          TENANT_ID: ${{ steps.context.outputs.TenantId }}
          STATE_PATH: ${{ runner.temp }}/avm-bicep-state/${{ steps.context.outputs.ArtifactKey }}.cleanup.json
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module $env:AVM_AUTHORING_MODULE -ErrorAction Stop
          Set-Location (Join-Path $env:GITHUB_WORKSPACE $env:MODULE_PATH)
          avm -SkipModuleVersionCheck test e2e --ecosystem bicep --subscription-id $env:SUBSCRIPTION_ID `
            --tenant-id $env:TENANT_ID --phase Complete --cleanup-state-path $env:STATE_PATH --confirm=false
      - name: Recover unfinished native cleanup
        if: ${{ !cancelled() && failure() && steps.deploy.outcome != 'skipped' && fromJSON(inputs.workflowInput).removeDeployment == 'true' && steps.renew_oidc.outcome == 'success' }}
        shell: pwsh
        env:
          SUBSCRIPTION_ID: ${{ steps.context.outputs.SubscriptionId }}
          TENANT_ID: ${{ steps.context.outputs.TenantId }}
          STATE_PATH: ${{ runner.temp }}/avm-bicep-state/${{ steps.context.outputs.ArtifactKey }}.cleanup.json
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module $env:AVM_AUTHORING_MODULE -ErrorAction Stop
          avm -SkipModuleVersionCheck test cleanup --state-path $env:STATE_PATH --subscription-id $env:SUBSCRIPTION_ID `
            --tenant-id $env:TENANT_ID --confirm=false
      - name: Retain recovery state
        if: always() && steps.context.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bicep-deployment-${{ steps.context.outputs.ArtifactKey }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/avm-bicep-state/*.json
          if-no-files-found: warn
          retention-days: 14
