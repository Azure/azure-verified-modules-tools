---
name: 'Repos: Workflow Failures'

# Design invariants -- do not regress these without a very good reason:
#  - schedule + workflow_dispatch only. This reads workflow-run/issue data
#    with a privileged cross-repo app token.
#  - Offset cron ('41 5 * * *') rather than a round-minute mark, because
#    schedule runs are best-effort and can be delayed or skipped.
#  - Every write (comment/assign/close) is conditional: an issue that already reflects the
#    latest run's outcome is left untouched.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      what_if:
        description: 'Compute and log the create/comment/close decisions without calling gh issue create/comment/edit/close.'
        default: true
        type: boolean
permissions:
  contents: read

concurrency:
  group: repository-management-workflow-failure-issues
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  manage-issues:
    name: Manage workflow failure issues
    if: github.repository == 'Azure/azure-verified-modules-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: avm
    steps:
      - name: Checkout trusted tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Avm.Authoring
        uses: Azure/azure-verified-modules-tools/.github/actions/install-avm-authoring@d44d0021b58a51e9630f3ce22008736507b57f81 # v0.0.0
      - name: Load Avm.Authoring
        shell: pwsh
        run: Import-Module Avm.Authoring

      - name: Create scoped workflow-issue token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AVM_APP_CLIENT_ID }}
          private-key: ${{ secrets.AVM_APP_PRIVATE_KEY }}
          owner: Azure
          repositories: bicep-registry-modules
          permission-issues: write
          permission-actions: read

      - name: Manage workflow failure issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WHAT_IF: ${{ inputs.what_if }}
        run: |
          Import-Module Avm.Authoring -Force -ErrorAction Stop

          $whatIf = $env:WHAT_IF -eq 'true'
          Write-Output "What if: $whatIf"

          ./repository-management/workflow-failure-issues/scripts/Invoke-AvmWorkflowFailureIssues.ps1 `
            -Repository 'Azure/bicep-registry-modules' `
            -WhatIf:$whatIf

          $global:LASTEXITCODE = 0
