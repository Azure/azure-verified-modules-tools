---
name: Repository Management - PR Reviewer Routing

# Design invariants -- do not regress these without a very good reason:
#  - Scheduled and workflow_dispatch only. Never pull_request/pull_request_target:
#    this run reads pull request data with a privileged cross-repo app token, and
#    that token must never be exposed to a run triggered by untrusted fork content.
#  - Offset crons, not round-minute marks (busiest, most likely to be delayed or
#    skipped). Lookback window is 4x the sweep cadence to absorb skipped runs,
#    plus a daily full sweep (UpdatedWithinMinutes 0) as a backstop.
on:
  workflow_dispatch:
    inputs:
      pull_request_url:
        description: 'Route a single pull request (URL or number). Leave blank to sweep all open pull requests.'
        default: ''
        type: string
      updated_within_minutes:
        description: 'Only sweep pull requests updated within the last N minutes. Use 0 for every open pull request.'
        default: '60'
        type: string
      what_if:
        description: 'Compute and log the routing decisions without calling gh pr edit.'
        default: true
        type: boolean
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '13 3 * * *'

permissions:
  contents: read

concurrency:
  group: repository-management-pr-reviewer-routing
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  route:
    name: '[AVM] Route pull request reviewers and labels'
    if: github.repository == 'Azure/azure-verified-modules-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: avm
    steps:
      - name: Checkout trusted tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '[AVM] Install Avm.Authoring'
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Install-PSResource -Name Avm.Authoring -Scope CurrentUser -TrustRepository -ErrorAction Stop
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
              Write-Warning "Avm.Authoring installation failed on attempt $attempt of ${maxAttempts}: $($_.Exception.Message). Retrying in $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          Import-Module Avm.Authoring

      - name: '[AVM] Create scoped reviewer routing token'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AVM_APP_CLIENT_ID }}
          private-key: ${{ secrets.AVM_APP_PRIVATE_KEY }}
          owner: Azure
          repositories: bicep-registry-modules
          permission-pull-requests: write
          permission-members: read

      - name: '[AVM] Route pull request reviewers and labels'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST_URL: ${{ inputs.pull_request_url }}
          UPDATED_WITHIN_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.updated_within_minutes || (github.event.schedule == '13 3 * * *' && '0' || '60') }}
          WHAT_IF: ${{ github.event_name == 'workflow_dispatch' && inputs.what_if }}
        run: |
          Write-Host 'Authenticating gh cli'
          gh auth login -h 'GitHub.com'

          $whatIf = $env:WHAT_IF -eq 'true'
          $updatedWithinMinutes = [int]$env:UPDATED_WITHIN_MINUTES

          Write-Output "Pull request URL override: $($env:PULL_REQUEST_URL)"
          Write-Output "Updated within minutes: $updatedWithinMinutes"
          Write-Output "What if: $whatIf"

          ./repository-management/reviewer-routing/scripts/Invoke-AvmPrReviewerRouting.ps1 `
            -Repository 'Azure/bicep-registry-modules' `
            -PullRequestUrl $env:PULL_REQUEST_URL `
            -UpdatedWithinMinutes $updatedWithinMinutes `
            -WhatIf:$whatIf
