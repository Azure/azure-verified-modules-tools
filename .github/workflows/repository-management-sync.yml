---
name: 'Repos: Terraform Sync'

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Override the target repositories, use a comma separated list. Leave as All to run on all repositories.'
        default: 'All'
        type: string
      repositories_to_skip:
        description: 'Additional repositories to skip, as a comma separated list. Permanent exclusions always apply.'
        default: ''
        type: string
      plan_only:
        description: 'Whether to only plan the changes'
        default: true
        type: boolean
      use_workflow_authoring_source:
        description: 'For plan-only runs, use Avm.Authoring from this workflow ref instead of the released Gallery version.'
        default: true
        type: boolean
      force_file_update:
        description: 'Force the latest managed-file release onto the selected repositories, even without a new major release.'
        default: false
        type: boolean
      sync_project_items:
        description: 'Whether to add each repository''s issues and PRs to the AVM All Up GitHub Project.'
        default: true
        type: boolean
      include_closed_project_items:
        description: 'Also add closed issues and closed/merged PRs to the project (heavy historical back-fill). Off by default.'
        default: false
        type: boolean
      project_lookback_days:
        description: 'Only add issues/PRs updated in the last N days (keeps runs under API rate limits). Use 0 to disable the look-back and sweep everything not already on the project (one-off initial back-fill).'
        default: '3'
        type: string
  schedule:
    - cron: '33 */4 * * 1-5'

permissions:
  id-token: write
  contents: read

# Each repo's Terraform state is a single blob, and a cancelled run leaves its
# lease behind. Queue overlapping runs rather than cancelling them, so the sync
# stays the only writer and any lock it does find is genuinely stale.
concurrency:
  group: repository-sync
  cancel-in-progress: false

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    environment: avm
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      matrixParallel: ${{ steps.matrix.outputs.matrixParallel }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate matrix
        uses: ./repository-management/repository-sync/actions/avm-repos
        id: matrix
        with:
          repositories: ${{ case(github.event_name == 'workflow_dispatch', inputs.repositories, 'All') }}
          repositoriesToSkip: ${{ case(github.event_name == 'workflow_dispatch', inputs.repositories_to_skip, '') }}
          clientId: ${{ vars.AVM_APP_CLIENT_ID }}
          privateKey: ${{ secrets.AVM_APP_PRIVATE_KEY }}

  sync-repository:
    name: Sync ${{ matrix.repoName }}
    needs: generate-matrix
    if: needs.generate-matrix.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.generate-matrix.outputs.matrixParallel) }}
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/repository-management-sync-repository.yml
    with:
      repo_id: ${{ matrix.repoId }}
      repo_name: ${{ matrix.repoName }}
      repo_url: ${{ matrix.repoUrl }}
      repo_metadata_json: ${{ toJson(matrix.repoMetaData) }}
      plan_only: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_only }}
      use_workflow_authoring_source: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_only && inputs.use_workflow_authoring_source }}
      force_file_update: ${{ github.event_name == 'workflow_dispatch' && inputs.force_file_update }}
      sync_project_items: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_project_items }}
      include_closed_project_items: ${{ github.event_name == 'workflow_dispatch' && inputs.include_closed_project_items }}
      project_lookback_days: ${{ github.event_name == 'workflow_dispatch' && inputs.project_lookback_days || '3' }}
    secrets: inherit
