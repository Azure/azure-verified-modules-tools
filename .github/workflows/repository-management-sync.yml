---
name: Repository Management - Repository Sync

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Override the target repositories, use a comma separated list. Leave as All to run on all repositories.'
        default: 'All'
        type: string
      repositories_to_skip:
        description: 'Additional repositories to skip, as a comma separated list. Permanent exclusions always apply.'
        default: ''
        type: string
      plan_only:
        description: 'Whether to only plan the changes'
        default: true
        type: boolean
      force_file_update:
        description: 'Force the latest managed-file release onto the selected repositories, even without a new major release.'
        default: false
        type: boolean
      sync_project_items:
        description: 'Whether to add each repository''s issues and PRs to the AVM All Up GitHub Project.'
        default: true
        type: boolean
      include_closed_project_items:
        description: 'Also add closed issues and closed/merged PRs to the project (heavy historical back-fill). Off by default.'
        default: false
        type: boolean
      project_lookback_days:
        description: 'Only add issues/PRs updated in the last N days (keeps runs under API rate limits). Use 0 to disable the look-back and sweep everything not already on the project (one-off initial back-fill).'
        default: '3'
        type: string
  schedule:
    - cron: '33 */4 * * 1-5'

permissions:
  id-token: write
  contents: read

# Each repo's Terraform state is a single blob, and a cancelled run leaves its
# lease behind. Queue overlapping runs rather than cancelling them, so the sync
# stays the only writer and any lock it does find is genuinely stale.
concurrency:
  group: repository-sync
  cancel-in-progress: false

env:
  # The GitHub Project (ProjectV2) that every AVM Terraform repo's issues and PRs
  # are synced into ("AVM All Up"). A central, fixed target, so it lives here as a
  # single workflow constant rather than a per-run input.
  PROJECT_URL: 'https://github.com/orgs/Azure/projects/1011'

defaults:
  run:
    working-directory: ./repository-management/repository-sync

jobs:
  generate-matrix:
    name: Repository Management - Generate Matrix
    runs-on: ubuntu-latest
    environment: avm
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      matrixParallel: ${{ steps.matrix.outputs.matrixParallel }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Matrix
        uses: ./repository-management/repository-sync/actions/avm-repos
        id: matrix
        with:
          repositories: ${{ case(github.event_name == 'workflow_dispatch', inputs.repositories, 'All') }}
          repositoriesToSkip: ${{ case(github.event_name == 'workflow_dispatch', inputs.repositories_to_skip, '') }}
          clientId: ${{ vars.AVM_APP_CLIENT_ID }}
          privateKey: ${{ secrets.AVM_APP_PRIVATE_KEY }}

  run-sync:
    name: Repository Management - ${{ matrix.repoId }} (${{ matrix.repoUrl }})
    runs-on: ubuntu-latest
    environment: avm
    needs: generate-matrix
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.generate-matrix.outputs.matrixParallel) }}
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - name: Install Avm.Authoring
        shell: pwsh
        run: |
          Install-PSResource -Name Avm.Authoring -Scope CurrentUser -TrustRepository
          Import-Module Avm.Authoring
          if (-not (Get-Command Invoke-AvmPreCommit).Parameters.ContainsKey('RepoId')) {
            throw 'The released Avm.Authoring version does not support repository sync options on avm pre-commit.'
          }

      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AVM_APP_CLIENT_ID }}
          private-key: ${{ secrets.AVM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Terraform authenticates on its own via the ARM_* variables below. The
      # Azure CLI needs its own login so state lock recovery can break the
      # lease on a state blob left locked by a cancelled run.
      - name: Azure Login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Download Labels CSV File
        run: |
          ./scripts/Get-AvmLabels.ps1
        shell: pwsh

      - name: Run Sync for ${{ matrix.repoId }}
        run: |

          $triggerType = "${{ github.event_name }}"

          $planOnly = $false
          $forceFileUpdate = $false

          if($triggerType -eq "workflow_dispatch") {
            $planOnly = "${{ inputs.plan_only }}".ToLower() -eq "true"
            $forceFileUpdate = "${{ inputs.force_file_update }}".ToLower() -eq "true"
          }

          Write-Output "Token: $env:GH_TOKEN"
          Write-Output "Repositories: $repositories"
          Write-Output "Plan Only: $planOnly"
          Write-Output "Force File Update: $forceFileUpdate"

          $testSubscriptionIds = $env:TEST_SUBSCRIPTION_IDS | ConvertFrom-Json

          $repoMetaDataJson = $env:REPO_META_DATA_JSON
          $repoMetaData = $null
          if ($repoMetaDataJson -and $repoMetaDataJson -ne 'null') {
            $repoMetaData = $repoMetaDataJson | ConvertFrom-Json
          }

          Write-Host "Authenticating gh cli"
          gh auth login -h "GitHub.com"
          Write-Host "Running repo sync"
          ./scripts/Invoke-RepositorySync.ps1 `
            -planOnly $planOnly `
            -managementGroupId "${{ vars.MANAGEMENT_GROUP_ID }}" `
            -testSubscriptionIds $testSubscriptionIds `
            -stateStorageAccountName "${{ vars.STORAGE_ACCOUNT_NAME }}" `
            -stateResourceGroupName "${{ vars.STORAGE_ACCOUNT_RESOURCE_GROUP_NAME }}" `
            -stateContainerName "${{ vars.STORAGE_ACCOUNT_CONTAINER_NAME }}" `
            -identityResourceGroupName "${{ vars.IDENTITY_RESOURCE_GROUP_NAME }}" `
            -repoId "${{ matrix.repoId }}" `
            -repoUrl "${{ matrix.repoUrl }}" `
            -repoMetaData $repoMetaData `
            -outputDirectory "${{ github.workspace }}" `
            -forceFileUpdate:$forceFileUpdate

        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
          ARM_USE_AZUREAD: true
          ARM_USE_OIDC: true
          TEST_SUBSCRIPTION_IDS: ${{ vars.TEST_SUBSCRIPTION_IDS }}
          REPO_META_DATA_JSON: ${{ toJson(matrix.repoMetaData) }}

      - name: Upload Issue Logs Json
        if: always() && hashFiles('issue.log.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.repoId }}.issue.log.json
          path: issue.log.json

      - name: Issue Error
        if: always() && hashFiles('issue.log.json') != ''
        run: |
          $issueLogJson = Get-Content -Path "${{ github.workspace }}/issue.log.json" -Raw
          $issueLog = ConvertFrom-Json $issueLogJson
          $hasError = $false
          $issueLog | ForEach-Object {
            $severity = if ($_.severity) { $_.severity } else { "error" }
            if ($severity -eq "warning") {
              echo "::warning title=${{ matrix.repoId }} has issues::$($_.message) Check the log file artifact for ${{ matrix.repoId }} to see the full details."
            } else {
              echo "::error title=${{ matrix.repoId }} has issues::$($_.message) Check the log file artifact for ${{ matrix.repoId }} to see the full details."
              $hasError = $true
            }
          }
          if ($hasError) { exit 1 }
        shell: pwsh

      - name: Add Repository Items to AVM All Up Project
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.sync_project_items) }}
        run: |

          $triggerType = "${{ github.event_name }}"

          $planOnly = $false
          $includeClosed = $false
          $projectUrl = $env:PROJECT_URL
          # Default look-back: scheduled/dispatch-by-event runs only consider items
          # updated in the last 3 days, which keeps steady-state runs well under the
          # GitHub API rate limits. A manual dispatch can override this (0 = full
          # sweep for the one-off initial back-fill).
          $lookbackDays = 3

          if ($triggerType -eq "workflow_dispatch") {
            $planOnly = "${{ inputs.plan_only }}".ToLower() -eq "true"
            $includeClosed = "${{ inputs.include_closed_project_items }}".ToLower() -eq "true"
            $parsedLookback = 0
            if ([int]::TryParse("${{ inputs.project_lookback_days }}".Trim(), [ref]$parsedLookback)) {
              $lookbackDays = $parsedLookback
            }
            else {
              Write-Output "Could not parse project_lookback_days '${{ inputs.project_lookback_days }}'; using default $lookbackDays."
            }
          }

          Write-Output "Project URL: $projectUrl"
          Write-Output "Include Closed: $includeClosed"
          Write-Output "Look-back Days: $lookbackDays"
          Write-Output "Plan Only: $planOnly"

          ./scripts/Add-RepositoryItemsToProject.ps1 `
            -repoUrl "${{ matrix.repoUrl }}" `
            -projectUrl $projectUrl `
            -includeClosed $includeClosed `
            -lookbackDays $lookbackDays `
            -planOnly $planOnly `
            -outputDirectory "${{ github.workspace }}"

        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload Project Sync Log Json
        if: always() && hashFiles('project-sync.log.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.repoId }}.project-sync.log.json
          path: project-sync.log.json

      - name: Project Sync Error
        if: always() && hashFiles('project-sync.log.json') != ''
        run: |
          $projectSyncLogJson = Get-Content -Path "${{ github.workspace }}/project-sync.log.json" -Raw
          $projectSyncLog = ConvertFrom-Json $projectSyncLogJson
          $projectSyncLog | ForEach-Object {
            $severity = if ($_.severity) { $_.severity } else { "warning" }
            if ($severity -eq "warning") {
              echo "::warning title=${{ matrix.repoId }} project sync::$($_.message) Check the log file artifact for ${{ matrix.repoId }} to see the full details."
            } else {
              echo "::error title=${{ matrix.repoId }} project sync::$($_.message) Check the log file artifact for ${{ matrix.repoId }} to see the full details."
            }
          }
        shell: pwsh
