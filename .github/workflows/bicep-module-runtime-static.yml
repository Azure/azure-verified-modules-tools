name: 'Reusable: Bicep Module Runtime Static'

on:
  workflow_call:
    inputs:
      modulePath:
        type: string
        required: true

permissions: {}

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AVM_CI_VARIABLES: '{}'
      AVM_CI_SECRETS: '{}'
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Avm.Authoring
        if: env.AVM_AUTHORING_MODULE == 'Avm.Authoring'
        uses: Azure/azure-verified-modules-tools/.github/actions/install-avm-authoring@d44d0021b58a51e9630f3ce22008736507b57f81 # v0.0.0
      - name: Run public static validation
        shell: pwsh
        env:
          MODULE_PATH: ${{ inputs.modulePath }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Avm.Authoring -ErrorAction Stop
          $capabilities = (Get-Module Avm.Authoring).PrivateData.AvmCapabilities
          if ($capabilities.BicepWorkflowOrchestration -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepWorkflowOrchestration = 1.'
          }
          Invoke-AvmTestUnit -Path (Join-Path $env:GITHUB_WORKSPACE $env:MODULE_PATH) `
            -Ecosystem bicep -Recurse -IncludeCompliance -SkipModuleVersionCheck
