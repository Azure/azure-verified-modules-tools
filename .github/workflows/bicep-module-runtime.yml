name: 'Reusable: Bicep Module Runtime'

on:
  workflow_call:
    inputs:
      modulePath:
        type: string
        required: true
      targetCommit:
        type: string
        required: true

permissions: {}

jobs:
  pr-check:
    name: '${{ inputs.modulePath }}: PR check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.targetCommit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Avm.Authoring
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
                Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
              }
              Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
              Install-PSResource -Name Avm.Authoring -Scope CurrentUser -TrustRepository -ErrorAction Stop
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) { throw }
              $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
              Write-Warning "Avm.Authoring installation failed on attempt $attempt of ${maxAttempts}: $($_.Exception.Message). Retrying in $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          Import-Module Avm.Authoring -ErrorAction Stop
          $capabilities = (Get-Module Avm.Authoring).PrivateData.AvmCapabilities
          if ($capabilities.BicepWorkflowOrchestration -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepWorkflowOrchestration = 1.'
          }
      - name: Run PR check
        shell: pwsh
        working-directory: ${{ inputs.modulePath }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Avm.Authoring -ErrorAction Stop
          avm pr-check

  unit-test:
    name: '${{ inputs.modulePath }}: Unit tests'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.targetCommit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Avm.Authoring
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              if (-not (Get-Module -ListAvailable -Name Microsoft.PowerShell.PSResourceGet)) {
                Install-Module -Name Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
              }
              Import-Module Microsoft.PowerShell.PSResourceGet -ErrorAction Stop
              Install-PSResource -Name Avm.Authoring -Scope CurrentUser -TrustRepository -ErrorAction Stop
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) { throw }
              $delaySeconds = 5 * [math]::Pow(2, $attempt - 1)
              Write-Warning "Avm.Authoring installation failed on attempt $attempt of ${maxAttempts}: $($_.Exception.Message). Retrying in $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          Import-Module Avm.Authoring -ErrorAction Stop
          $capabilities = (Get-Module Avm.Authoring).PrivateData.AvmCapabilities
          if ($capabilities.BicepWorkflowOrchestration -ne 1) {
            throw 'The installed Avm.Authoring package does not provide BicepWorkflowOrchestration = 1.'
          }
      - name: Run unit tests
        shell: pwsh
        working-directory: ${{ inputs.modulePath }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Avm.Authoring -ErrorAction Stop
          avm test unit --recurse --include-compliance
