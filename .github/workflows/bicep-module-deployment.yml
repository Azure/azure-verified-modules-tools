name: 'Reusable: Bicep Module Deployment'

on:
  workflow_call:
    inputs:
      tools-ref:
        description: Full tools commit SHA, identical to the caller's workflow revision.
        type: string
        required: true
      workflowInput:
        type: string
        required: true
      modulePath:
        type: string
        required: true
      testCase:
        type: string
        required: true
      tokenNamePrefix:
        type: string
        required: false
      targetCommit:
        description: Optional validated caller commit; defaults to the triggering commit.
        type: string
        required: false

permissions: {}

jobs:
  job_module_deploy_validation:
    name: 'Deploy [${{ fromJSON(inputs.testCase).name }}] on [${{ fromJSON(inputs.testCase).subscriptionName }}]'
    environment: avm-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ fromJSON(inputs.testCase).concurrencyGroup }}
      queue: max
    steps:
      - name: Report skipped deployment
        if: fromJSON(inputs.testCase).e2eIgnore
        shell: pwsh
        env:
          TEST_PATH: ${{ fromJSON(inputs.testCase).path }}
        run: Write-Output "Deployment skipped for $env:TEST_PATH because .e2eignore is set."
      - name: Validate tools revision
        if: ${{ !fromJSON(inputs.testCase).e2eIgnore }}
        shell: pwsh
        env:
          TOOLS_REF: ${{ inputs.tools-ref }}
          TARGET_COMMIT: ${{ inputs.targetCommit || github.sha }}
        run: |
          if ($env:TOOLS_REF -cnotmatch '^[0-9a-f]{40}$' -or $env:TARGET_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Workflow revisions must be full immutable commit SHAs.' }
      - name: Check out caller
        if: ${{ !fromJSON(inputs.testCase).e2eIgnore }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.targetCommit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out workflow support
        if: ${{ !fromJSON(inputs.testCase).e2eIgnore }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Azure/azure-verified-modules-tools
          ref: ${{ inputs.tools-ref }}
          path: .avm-tools
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts/bicep-workflows
            repository-management/shared
      - name: Run native deployment lifecycle
        if: ${{ !fromJSON(inputs.testCase).e2eIgnore }}
        uses: ./.avm-tools/.github/actions/bicep-deployment
        with:
          modulePath: ${{ inputs.modulePath }}
          workflowInput: ${{ inputs.workflowInput }}
          testCase: ${{ inputs.testCase }}
          subscriptionPool: ${{ vars.VALIDATE_SUBSCRIPTION_IDS || vars.TEST_SUBSCRIPTION_IDS || secrets.VALIDATE_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          fallbackSubscriptionId: ${{ vars.VALIDATE_SUBSCRIPTION_ID || secrets.VALIDATE_SUBSCRIPTION_ID }}
          moduleClientIds: ${{ vars.VALIDATE_MODULE_CLIENT_IDS }}
          tenantId: ${{ vars.VALIDATE_TENANT_ID || secrets.VALIDATE_TENANT_ID }}
          managementGroupId: ${{ vars.VALIDATE_MANAGEMENT_GROUP_ID || vars.ARM_MGMTGROUP_ID || secrets.VALIDATE_MANAGEMENT_GROUP_ID || secrets.ARM_MGMTGROUP_ID }}
          tokenNamePrefix: ${{ inputs.tokenNamePrefix || secrets.TOKEN_NAMEPREFIX }}
          ciKeyVaultName: ${{ vars.CI_KEY_VAULT_NAME }}
          githubVariables: ${{ toJSON(vars) }}
          githubSecrets: ${{ toJSON(secrets) }}
