name: 'Tools: CI'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope to run without change filtering
        type: choice
        required: true
        default: all
        options:
          - all
          - authoring
          - workflows
          - repository-management

permissions:
  contents: read

env:
  DOTNET_MultiCoreJitMinNumCpus: '7fffffff'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select test scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authoring: ${{ steps.scope.outputs.authoring }}
      workflows: ${{ steps.scope.outputs.workflows }}
      repository-management: ${{ steps.scope.outputs.repository-management }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected suites
        id: scope
        shell: pwsh
        run: |
          $scope = ./scripts/Get-AvmCiScope.ps1
          foreach ($entry in $scope.GetEnumerator()) {
              $value = $entry.Value.ToString().ToLowerInvariant()
              "$($entry.Key)=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "$($entry.Key): $value"
          }

  authoring:
    name: Authoring
    needs: changes
    if: needs.changes.outputs.authoring == 'true'
    uses: ./.github/workflows/ci-authoring.yml
    permissions:
      contents: read
      code-quality: write    # the Ubuntu unit job uploads coverage
      pull-requests: read
      id-token: write        # the existing environment-gated integration jobs

  workflows:
    name: Workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/ci-workflows.yml

  repository-management:
    name: Repository management
    needs: changes
    if: needs.changes.outputs.repository-management == 'true'
    uses: ./.github/workflows/repository-management-config-test.yml

  report:
    name: CI result
    needs: [changes, authoring, workflows, repository-management]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write          # create the Checks-tab test report
      pull-requests: write   # post or update the results comment
      contents: read
    steps:
      - name: Download test results
        if: ${{ !cancelled() && (needs.changes.outputs.authoring == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.repository-management == 'true') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-results-*
          path: artifacts

      - name: Publish test results
        if: ${{ !cancelled() && (needs.changes.outputs.authoring == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.repository-management == 'true') }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: Test results
          files: artifacts/**/*.xml
          report_individual_runs: "true"

      - name: Verify selected suites
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          CI_NEEDS: ${{ toJson(needs) }}
        run: |
          $needs = $env:CI_NEEDS | ConvertFrom-Json -AsHashtable
          if ($needs.changes.result -ne 'success') {
              throw [System.InvalidOperationException]::new('CI could not determine the affected test scopes.')
          }
          $failed = @()
          foreach ($name in @('authoring', 'workflows', 'repository-management')) {
              $selected = $needs.changes.outputs[$name]
              $result = $needs[$name].result
              "$name`: selected=$selected, result=$result" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              $expected = if ($selected -ceq 'true') { 'success' } else { 'skipped' }
              if ($selected -cnotin @('true', 'false') -or $result -cne $expected) {
                  $failed += "$name ($result)"
              }
          }
          if ($failed.Count -gt 0) {
              throw [System.InvalidOperationException]::new("CI suites did not complete as selected: $($failed -join ', ').")
          }
