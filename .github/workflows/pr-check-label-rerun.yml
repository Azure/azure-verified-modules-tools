name: 'Reusable: PR check E2E label rerun'

# Callers own the workflow_run trigger and permission wiring because a reusable
# workflow cannot declare caller events or elevate the caller token.
on:
  workflow_call:
    inputs:
      tools-ref:
        description: Full tools commit SHA containing this reusable workflow and action.
        type: string
        required: true
      observer-workflow-path:
        description: Exact caller workflow path for the read-only pull_request observer.
        type: string
        required: true

permissions: {}

jobs:
  rerun-pr-check:
    name: Rerun PR check
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == inputs.observer-workflow-path &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: pr-check-label-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Validate tools revision
        shell: pwsh
        env:
          TOOLS_REF: ${{ inputs.tools-ref }}
          OBSERVER_WORKFLOW_PATH: ${{ inputs.observer-workflow-path }}
        run: |
          if ($env:TOOLS_REF -cnotmatch '^[0-9a-f]{40}$') {
            throw 'tools-ref must be the full immutable SHA used by the caller.'
          }
          if ($env:OBSERVER_WORKFLOW_PATH -cnotmatch '^\.github/workflows/[A-Za-z0-9._-]+\.ya?ml$') {
            throw 'observer-workflow-path must be a workflow path under .github/workflows.'
          }
      - name: Check out trusted Tools revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Azure/azure-verified-modules-tools
          ref: ${{ inputs.tools-ref }}
          path: .avm-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Rerun the matching PR check
        id: rerun
        uses: ./.avm-tools/.github/actions/pr-check-rerun
        with:
          observerRunId: ${{ github.event.workflow_run.id }}
          observerWorkflowPath: ${{ inputs.observer-workflow-path }}
