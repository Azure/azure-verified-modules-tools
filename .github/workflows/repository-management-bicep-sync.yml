---
name: Repository Management - Bicep Sync

on:
  schedule:
    - cron: '33 2-23/4 * * *'
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Dry run only: inspect changes without committing, pushing, opening, or merging pull requests.'
        default: true
        type: boolean
      metadata_backfill:
        description: 'ONE-OFF: backfill reviewed module metadata instead of synchronizing CODEOWNERS. Never auto-merges.'
        default: false
        type: boolean
      metadata_update_source:
        description: 'ONE-OFF: also add source readers where the reviewed seed permits it. Requires metadata_backfill.'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bicep-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Repository Management - Bicep Sync
    if: >-
      github.repository == 'Azure/azure-verified-modules-tools' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: avm
    timeout-minutes: 55
    steps:
      - name: Checkout trusted tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Validate metadata backfill opt-in
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.metadata_backfill || inputs.metadata_update_source) }}
        shell: pwsh
        env:
          METADATA_BACKFILL: ${{ inputs.metadata_backfill }}
          METADATA_UPDATE_SOURCE: ${{ inputs.metadata_update_source }}
        run: |
          if ($env:METADATA_BACKFILL -ne 'true') {
            throw 'metadata_update_source requires explicit metadata_backfill opt-in.'
          }
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'src' 'Avm.Authoring' 'Avm.Authoring.psd1') -Force
          . (Join-Path $env:GITHUB_WORKSPACE 'repository-management' 'module-metadata' 'MetadataBackfillSync.ps1')
          $null = Get-AvmRepositoryMetadataBackfillContext -orgAndRepoName 'Azure/bicep-registry-modules' -Ecosystem bicep

      - name: Create target-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AVM_APP_CLIENT_ID }}
          private-key: ${{ secrets.AVM_APP_PRIVATE_KEY }}
          owner: Azure
          repositories: bicep-registry-modules
          permission-contents: write
          permission-pull-requests: write

      - name: Synchronize Bicep repository files
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AVM_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PLAN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_only }}
          METADATA_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.metadata_backfill || false }}
          METADATA_UPDATE_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.metadata_update_source || false }}
        run: |
          if ($env:AVM_APP_SLUG -cne 'azure-verified-modules') {
            throw 'The configured GitHub App is not azure-verified-modules.'
          }
          if ($env:METADATA_BACKFILL -eq 'true') {
            & (Join-Path $env:GITHUB_WORKSPACE 'repository-management' 'module-metadata' 'Invoke-BicepMetadataBackfillSync.ps1') `
              -PlanOnly:($env:PLAN_ONLY -eq 'true') -UpdateSource:($env:METADATA_UPDATE_SOURCE -eq 'true')
          } else {
            if ($env:METADATA_UPDATE_SOURCE -eq 'true') {
              throw 'metadata_update_source requires explicit metadata_backfill opt-in.'
            }
            & (Join-Path $env:GITHUB_WORKSPACE 'repository-management' 'bicep-codeowners-sync' 'scripts' 'Invoke-BicepCodeownersSync.ps1') `
              -PlanOnly:($env:PLAN_ONLY -eq 'true')
          }
