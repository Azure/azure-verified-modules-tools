---
name: 'Repos: Bicep Sync'

on:
  schedule:
    - cron: '33 2-23/4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bicep-sync
  cancel-in-progress: false

jobs:
  sync-test-tenant-variables:
    name: Sync test tenant variables
    if: >-
      github.repository == 'Azure/azure-verified-modules-tools' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: avm
    timeout-minutes: 20
    steps:
      - name: Checkout trusted tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Create target-scoped Variables token
        id: variables-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AVM_APP_CLIENT_ID }}
          private-key: ${{ secrets.AVM_APP_PRIVATE_KEY }}
          owner: Azure
          repositories: bicep-registry-modules
          permission-actions-variables: write

      - name: Publish nonsecret Bicep test tenant variables
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.variables-token.outputs.token }}
          AVM_APP_SLUG: ${{ steps.variables-token.outputs.app-slug }}
          TEST_BAMI_TENANT_ID: ${{ vars.TEST_BAMI_TENANT_ID }}
          TEST_BAMI_CONTROLLER_CLIENT_ID: ${{ vars.TEST_BAMI_CONTROLLER_CLIENT_ID }}
          TEST_BAMI_ADMIN_SUBSCRIPTION_ID: ${{ vars.TEST_BAMI_ADMIN_SUBSCRIPTION_ID }}
          TEST_BAMI_SUBSCRIPTION_IDS: ${{ vars.TEST_BAMI_SUBSCRIPTION_IDS }}
          TEST_BAMI_MANAGEMENT_GROUP_ID: ${{ vars.TEST_BAMI_MANAGEMENT_GROUP_ID }}
          TEST_BAMI_IDENTITY_RESOURCE_GROUP_NAME: ${{ vars.TEST_BAMI_IDENTITY_RESOURCE_GROUP_NAME }}
          TEST_BAMI_BICEP_CLIENT_ID: ${{ vars.TEST_BAMI_BICEP_CLIENT_ID }}
          TEST_BAMI_PERSISTENT_SUBSCRIPTION_ID: ${{ vars.TEST_BAMI_PERSISTENT_SUBSCRIPTION_ID }}
        run: |
          if ($env:AVM_APP_SLUG -cne 'azure-verified-modules') {
            throw 'The configured GitHub App is not azure-verified-modules.'
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'repository-management' 'bicep-test-tenant-sync' 'scripts' 'Invoke-BicepTestTenantSync.ps1') -Apply
