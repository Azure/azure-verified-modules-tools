---
name: Repository Management - Configuration Tests

on:
  pull_request:
    paths:
      - .github/workflows/repository-management-config-test.yml
      - .github/workflows/repository-management-sync.yml
      - repository-management/repository-config/config.json
      - repository-management/repository-sync/scripts/Invoke-RepositorySync.ps1
      - repository-management/repository-sync/scripts/lib/AvmPreCommit.ps1
      - repository-management/repository-sync/scripts/lib/ManagedFilesUpgrade.ps1
      - repository-management/repository-sync/scripts/lib/RepositoryConfig.ps1
      - repository-management/repository-sync/scripts/lib/TeamsAndUsers.ps1
      - repository-management/repository-sync/scripts/Test-AvmPreCommit.ps1
      - repository-management/repository-sync/scripts/Test-ManagedFilesUpgrade.ps1
      - repository-management/repository-sync/scripts/Test-RepositoryConfig.ps1
      - repository-management/repository-sync/scripts/Test-RepositorySyncInputs.ps1
      - repository-management/repository-sync/scripts/Test-TeamsAndUsers.ps1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Repository Management - Test Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test repository configuration
        shell: pwsh
        run: |
          ./repository-management/repository-sync/scripts/Test-RepositoryConfig.ps1
          ./repository-management/repository-sync/scripts/Test-AvmPreCommit.ps1
          ./repository-management/repository-sync/scripts/Test-ManagedFilesUpgrade.ps1
          ./repository-management/repository-sync/scripts/Test-RepositorySyncInputs.ps1
          ./repository-management/repository-sync/scripts/Test-TeamsAndUsers.ps1
