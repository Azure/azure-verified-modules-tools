---
name: 'Repos: CI'

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_MultiCoreJitMinNumCpus: '7fffffff'

jobs:
  pester:
    name: Repository tests (${{ matrix.task }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        task: [test, component]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build prerequisites
        shell: pwsh
        run: ./scripts/Install-AvmBuildPrerequisites.ps1 -Confirm:$false

      - name: Run repository management tests
        shell: pwsh
        run: ./build.ps1 ${{ matrix.task }} -TestGroup RepositoryManagement

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-repository-management-${{ matrix.task }}-${{ matrix.os }}
          path: out/test-results/*.xml
          if-no-files-found: warn
          retention-days: 7

  infra:
    name: Validate state infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build runner
        shell: pwsh
        run: Install-PSResource -Name InvokeBuild -Version '[5.11.0,)' -Scope CurrentUser -TrustRepository
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false
      - name: Validate Terraform without deploying
        shell: pwsh
        run: ./build.ps1 infra,test-tenant-terraform

  test:
    name: Test configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test repository configuration
        shell: pwsh
        run: |
          ./repository-management/repository-sync/scripts/Test-RepositoryConfig.ps1
          ./repository-management/repository-sync/scripts/Test-AvmPreCommit.ps1
          ./repository-management/repository-sync/scripts/Test-ManagedFilesUpgrade.ps1
          ./repository-management/repository-sync/scripts/Test-RepositorySyncInputs.ps1
          ./repository-management/repository-sync/scripts/Test-TeamsAndUsers.ps1
