# Reusable CI workflow for Azure Verified Modules (AVM) Terraform module repos.
#
# This is the PowerShell-Gallery replacement for the governance-managed
# legacy Terraform governance `managed-pr-check.yml` template. Instead of
# running the toolchain inside a Docker image via make + porch, it installs the
# `Avm.Authoring` module from the PowerShell Gallery and drives the same test
# tiers through the `avm` CLI. The runner is assumed to have PowerShell 7.4+
# available (the `ubuntu-latest` image ships it).
#
# Consuming module repos call it like:
#
#   jobs:
#     ci:
#       uses: Azure/azure-verified-modules-tools/.github/workflows/terraform-module.yml@<ref>
#       permissions:
#         id-token: write
#         contents: read
#         pull-requests: write
#       secrets: inherit
#
# `secrets: inherit` is required for normal branches, not forks.
# The "Prepare test environment" step fans the
# secret + variable sets into $GITHUB_ENV so terraform and example hooks
# inherit them. Identity overrides apply only to e2e and may target a separate
# subscription; PR check and integration use the standard identity and
# selected General subscription. This replaces
# the governance cred-prep script's curated
# `AVM_*` / `TF_VAR_*` subset forwarding - and makes the old `AVM_BARE_` prefix
# escape hatch redundant, so it is intentionally dropped here.
# PR check and integration also expose lowercase TF_VAR suffix aliases and
# bind TF_VAR_subscription_id to the selected General subscription.
# Repositories opting in through AVM_AZURE_LOCAL_ENVIRONMENT_LOCK instead pin
# E2E to its reserved subscription and expose AVM_AZURE_LOCAL_ENVIRONMENT.
#
# Divergences from the governance template (tracked as follow-ups):
#   * There is no global setup/teardown stage; the module implements per-example
#     pre.ps1 / post.ps1 hooks only.
#   * The tiers emit structured envelopes to the log rather than JUnit XML, so
#     there is no separate test-report publishing job.

name: 'Reusable: Terraform Module'

on:
  workflow_call:
    inputs:
      avm-authoring-version:
        description: >-
          Optional version (or version range) of the Avm.Authoring module to
          install from the PowerShell Gallery. Defaults to the latest published
          version.
        type: string
        required: false
        default: ''
      authoringSource:
        description: Where to obtain the Avm.Authoring PowerShell module.
        type: string
        default: gallery
      authoringRef:
        description: 'Avm.Authoring reference: authoringSource=gallery uses a package version (blank = latest); authoringSource=repo uses a tools SHA, tag or branch (blank = latest stable tag).'
        type: string
        default: ''

permissions:
  contents: read

env:
  # terraform automation defaults (parity with the governance template).
  ARM_USE_OIDC: 'true'
  TF_IN_AUTOMATION: '1'
  TF_VAR_enable_telemetry: 'false'
  NO_COLOR: '1'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  bootstrap:
    name: Prepare authoring runtime
    permissions:
      contents: read
    uses: ./.github/workflows/authoring-bootstrap.yml
    with:
      authoringSource: ${{ inputs.authoringSource }}
      authoringRef: ${{ inputs.authoringRef }}
      legacyVersion: ${{ inputs.avm-authoring-version }}

  subscriptions:
    name: Select test subscription
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    environment: no-approval
    outputs:
      subscriptionOrder: ${{ steps.pick.outputs.subscriptionOrder }}
    steps:
      - name: Shuffle and select a test subscription
        id: pick
        shell: pwsh
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.TEST_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          FALLBACK_SUBSCRIPTION_ID_SECRET: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          FALLBACK_SUBSCRIPTION_ID_VAR: ${{ vars.ARM_SUBSCRIPTION_ID }}
        run: &select-test-subscription |
          $ErrorActionPreference = 'Stop'

          $raw = $env:TEST_SUBSCRIPTION_IDS
          if (-not [string]::IsNullOrEmpty($raw) -and [string]::IsNullOrWhiteSpace($raw)) {
              throw [System.ArgumentException]::new('TEST_SUBSCRIPTION_IDS must not contain only whitespace.')
          }
          if (-not [string]::IsNullOrWhiteSpace($raw)) {
              $document = [System.Text.Json.JsonDocument]::Parse($raw)
              try {
                  if ($document.RootElement.ValueKind -ne [System.Text.Json.JsonValueKind]::Array) {
                      throw [System.ArgumentException]::new('TEST_SUBSCRIPTION_IDS must be a JSON array.')
                  }
                  foreach ($entry in $document.RootElement.EnumerateArray()) {
                      if ($entry.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
                          throw [System.ArgumentException]::new('Test subscription entries must be objects.')
                      }
                      $names = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
                      foreach ($property in $entry.EnumerateObject()) {
                          if (-not $names.Add($property.Name)) {
                              throw [System.ArgumentException]::new('Test subscription entries must not contain duplicate properties.')
                          }
                          if ($property.Name -ieq 'tag' -and $property.Name -cne 'tag') {
                              throw [System.ArgumentException]::new('The optional test subscription tag field must use lowercase tag.')
                          }
                          if ($property.Name -cnotin @('id', 'name', 'tag')) {
                              throw [System.ArgumentException]::new('Test subscription entries support only id, name, and optional tag properties.')
                          }
                      }
                  }
              }
              finally {
                  $document.Dispose()
              }
              $subs = ConvertFrom-Json -InputObject $raw -AsHashtable -NoEnumerate
              $identifiers = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
              foreach ($entry in $subs) {
                  $identifier = [guid]::Empty
                  if ($entry['id'] -isnot [string] -or
                      -not [guid]::TryParseExact($entry['id'], 'D', [ref]$identifier) -or
                      $identifier -eq [guid]::Empty -or -not $identifiers.Add($identifier.ToString('D')) -or
                      $entry['name'] -isnot [string] -or [string]::IsNullOrWhiteSpace($entry['name']) -or
                      $entry['name'] -match '[\x00-\x1f\x7f]') {
                      throw [System.ArgumentException]::new('Test subscriptions must have distinct nonempty GUIDs and nonempty names without control characters.')
                  }
                  if ($entry.Contains('tag') -and (
                      $entry['tag'] -isnot [string] -or $entry['tag'].Length -gt 64 -or
                      $entry['tag'] -cnotmatch '\A[A-Za-z0-9]+(?:[ -][A-Za-z0-9]+)*\z')) {
                      throw [System.ArgumentException]::new('A test subscription tag must be a string of at most 64 alphanumeric characters separated by single spaces or hyphens.')
                  }
              }
              $subs = @($subs | Where-Object { -not $_.Contains('tag') -or $_['tag'] -ceq 'General' })
              if ($subs.Count -eq 0) {
                  throw [System.ArgumentException]::new('TEST_SUBSCRIPTION_IDS must contain at least one General subscription; a configured pool never falls back to ARM_SUBSCRIPTION_ID.')
              }
          }
          else {
              $fallback = $env:FALLBACK_SUBSCRIPTION_ID_SECRET
              if ([string]::IsNullOrWhiteSpace($fallback)) {
                  $fallback = $env:FALLBACK_SUBSCRIPTION_ID_VAR
              }
              if ([string]::IsNullOrWhiteSpace($fallback)) {
                  throw 'No test subscriptions configured. Set the TEST_SUBSCRIPTION_IDS variable (JSON array of { id, name }), its legacy secret, or an ARM_SUBSCRIPTION_ID secret/variable.'
              }
              $subs = @([pscustomobject]@{ id = $fallback; name = $fallback })
          }

          if ([string]::IsNullOrWhiteSpace($env:SUBSCRIPTION_ORDER)) {
              if (-not [string]::IsNullOrWhiteSpace($env:JOB_INDEX)) {
                  throw [System.InvalidOperationException]::new('No subscription order was published by the subscriptions job.')
              }
              $order = @(0..($subs.Count - 1) | Get-Random -Shuffle)
          }
          else {
              $order = @($env:SUBSCRIPTION_ORDER.Split(','))
              if ($order.Count -ne $subs.Count -or
                  @($order | Select-Object -Unique).Count -ne $subs.Count) {
                  throw [System.ArgumentException]::new('The subscription order must contain every General pool index exactly once.')
              }
              foreach ($index in $order) {
                  $parsed = 0
                  if ($index -cnotmatch '\A(?:0|[1-9][0-9]*)\z' -or
                      -not [int]::TryParse($index, [ref]$parsed) -or $parsed -ge $subs.Count) {
                      throw [System.ArgumentException]::new('The subscription order contains an invalid General pool index.')
                  }
              }
              $order = @($order | ForEach-Object { [int] $_ })
          }
          $subs = @($order | ForEach-Object { $subs[$_] })
          $jobIndex = 0
          if (-not [string]::IsNullOrWhiteSpace($env:JOB_INDEX) -and (
              -not [int]::TryParse($env:JOB_INDEX, [ref]$jobIndex) -or $jobIndex -lt 0)) {
              throw [System.ArgumentException]::new('JOB_INDEX must be a nonnegative integer.')
          }
          $chosen = $subs[$jobIndex % $subs.Count]
          if ([string]::IsNullOrWhiteSpace([string]$chosen.id)) {
              throw "Selected subscription entry has no 'id' property."
          }

          # Keep IDs within each job; GitHub can suppress the secret JSON pool.
          $ordered = '[{0}]' -f (($subs | ForEach-Object {
                  ConvertTo-Json -Compress -InputObject ([pscustomobject]@{ id = [string]$_.id; name = [string]$_.name })
              }) -join ',')

          "subscriptionId=$($chosen.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "subscriptionName=$($chosen.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "subscriptionIds=$ordered" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "subscriptionOrder=$($order -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Selected test subscription '$($chosen.name)' ($($subs.Count) available)."

  unit-test:
    name: Unit tests
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: &unprivileged-environment
      SECRETS_CONTEXT: '{}'
      VARS_CONTEXT: '{}'
      ARM_USE_OIDC: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AVM tool cache
        shell: pwsh
        run: &configure-avm-tool-cache |
          $ErrorActionPreference = 'Stop'
          $avmHome = Join-Path $env:RUNNER_TEMP 'avm-home'
          $cache = Join-Path $env:RUNNER_TEMP 'tf-plugin-cache'
          New-Item -ItemType Directory -Force -Path $avmHome, $cache | Out-Null
          "AVM_HOME=$avmHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TF_PLUGIN_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download prepared authoring runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bootstrap.outputs.artifact }}
          path: ${{ runner.temp }}/avm-authoring

      - name: Unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          Remove-Item -LiteralPath 'Env:\TF_VAR_enable_telemetry'
          avm -SkipModuleVersionCheck test unit

  pr-check-fork:
    name: PR check (fork)
    if: github.event.pull_request.head.repo.fork == true
    needs: bootstrap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: *unprivileged-environment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AVM tool cache
        shell: pwsh
        run: *configure-avm-tool-cache

      - name: Download prepared authoring runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bootstrap.outputs.artifact }}
          path: ${{ runner.temp }}/avm-authoring

      - name: Run PR check without policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          if (-not (Get-Command Invoke-AvmPrCheck).Parameters.ContainsKey('ExcludeSteps')) {
              throw 'Fork checks require an Avm.Authoring release with -ExcludeSteps. Update avm-authoring-version to a compatible release.'
          }
          avm -SkipModuleVersionCheck pr-check -ExcludeSteps 'check policy'

  pr-check:
    name: PR check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    needs: [bootstrap, subscriptions]
    runs-on: ubuntu-latest
    environment: pr-check
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AVM tool cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $avmHome = Join-Path $env:RUNNER_TEMP 'avm-home'
          $cache = Join-Path $env:RUNNER_TEMP 'tf-plugin-cache'
          New-Item -ItemType Directory -Force -Path $avmHome, $cache | Out-Null
          "AVM_HOME=$avmHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TF_PLUGIN_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Select test subscription
        id: pick
        shell: pwsh
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.TEST_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          FALLBACK_SUBSCRIPTION_ID_SECRET: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          FALLBACK_SUBSCRIPTION_ID_VAR: ${{ vars.ARM_SUBSCRIPTION_ID }}
          SUBSCRIPTION_ORDER: ${{ needs.subscriptions.outputs.subscriptionOrder }}
          JOB_INDEX: '0'
        run: *select-test-subscription

      - name: Prepare test environment
        id: test-environment
        shell: pwsh
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          VARS_CONTEXT: ${{ toJson(vars) }}
          SELECTED_SUBSCRIPTION_ID: ${{ steps.pick.outputs.subscriptionId }}
          SUBSCRIPTION_IDS: ${{ steps.pick.outputs.subscriptionIds }}
        run: &prepare-standard-test-environment |
          $ErrorActionPreference = 'Stop'

          $protected = @(
              'PATH','HOME','USER','PWD','SHELL','LANG','LC_ALL','TMPDIR','TEMP','TMP',
              'CI','GITHUB_ACTIONS','GITHUB_ENV','GITHUB_PATH','GITHUB_OUTPUT',
              'GITHUB_STATE','GITHUB_STEP_SUMMARY','GITHUB_WORKSPACE','GITHUB_TOKEN',
              'RUNNER_TEMP','RUNNER_TOOL_CACHE','RUNNER_WORKSPACE','RUNNER_OS',
              'RUNNER_ARCH','RUNNER_NAME','RUNNER_DEBUG',
              'ACTIONS_ID_TOKEN_REQUEST_TOKEN','ACTIONS_ID_TOKEN_REQUEST_URL',
              'ACTIONS_RUNTIME_TOKEN','ACTIONS_RUNTIME_URL','ACTIONS_CACHE_URL',
              'AVM_HOME','TF_PLUGIN_CACHE_DIR'
          )

          function ConvertFrom-Context {
              param([string] $Json)
              if ([string]::IsNullOrWhiteSpace($Json)) { return @{} }
              return ($Json | ConvertFrom-Json -AsHashtable)
          }

          $secretsMap = ConvertFrom-Context $env:SECRETS_CONTEXT
          $varsMap = ConvertFrom-Context $env:VARS_CONTEXT

          $combined = @{}
          foreach ($k in $varsMap.Keys) { $combined[$k] = $varsMap[$k] }
          foreach ($k in $secretsMap.Keys) { $combined[$k] = $secretsMap[$k] }
          foreach ($name in 'ARM_CLIENT_ID', 'ARM_TENANT_ID', 'TEST_SUBSCRIPTION_IDS') {
              if (-not [string]::IsNullOrEmpty([string] $varsMap[$name])) {
                  $combined[$name] = $varsMap[$name]
              }
          }

          $allowedSubscriptions = @($env:SUBSCRIPTION_IDS | ConvertFrom-Json)
          if ($allowedSubscriptions.Count -eq 0 -or
              $env:SELECTED_SUBSCRIPTION_ID -notin @($allowedSubscriptions.id)) {
              throw [System.InvalidOperationException]::new('The selected subscription must belong to the published General test pool.')
          }
          $combined['TEST_SUBSCRIPTION_IDS'] = $env:SUBSCRIPTION_IDS

          foreach ($key in $combined.Keys) {
              if ($key -eq 'github_token') { continue }
              if ($key -match '^(?:TF_VAR_)?ARM_(?:CLIENT_ID|TENANT_ID|SUBSCRIPTION_ID)_OVERRIDE$') { continue }
              if ($protected -contains $key.ToUpperInvariant()) {
                  Write-Host "Skipping protected name '$key'."
                  continue
              }
              $value = [string] $combined[$key]
              $delim = "AVM_ENV_$([guid]::NewGuid().ToString('N'))"
              "$key<<$delim`n$value`n$delim" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              if ($key -match '^TF_VAR_(.+)$') {
                  $terraformName = "TF_VAR_$($Matches[1].ToLowerInvariant())"
                  if ($terraformName -cne $key) {
                      "$terraformName<<$delim`n$value`n$delim" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  }
              }
          }

          # Azure OIDC plumbing for terraform (ARM_USE_OIDC=true).
          if (-not [string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)) {
              "ARM_OIDC_REQUEST_TOKEN=$($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          if (-not [string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_URL)) {
              "ARM_OIDC_REQUEST_URL=$($env:ACTIONS_ID_TOKEN_REQUEST_URL)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          'SECRETS_CONTEXT={}' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'VARS_CONTEXT={}' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARM_SUBSCRIPTION_ID=$($env:SELECTED_SUBSCRIPTION_ID)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TF_VAR_subscription_id=$($env:SELECTED_SUBSCRIPTION_ID)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "subscriptionId=$($env:SELECTED_SUBSCRIPTION_ID)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download prepared authoring runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bootstrap.outputs.artifact }}
          path: ${{ runner.temp }}/avm-authoring

      - name: PR check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          avm -SkipModuleVersionCheck pr-check

  integration-test:
    name: Integration tests
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    needs: [bootstrap, subscriptions]
    runs-on: ubuntu-latest
    environment: integration-test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AVM tool cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $avmHome = Join-Path $env:RUNNER_TEMP 'avm-home'
          $cache = Join-Path $env:RUNNER_TEMP 'tf-plugin-cache'
          New-Item -ItemType Directory -Force -Path $avmHome, $cache | Out-Null
          "AVM_HOME=$avmHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TF_PLUGIN_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Select test subscription
        id: pick
        shell: pwsh
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.TEST_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          FALLBACK_SUBSCRIPTION_ID_SECRET: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          FALLBACK_SUBSCRIPTION_ID_VAR: ${{ vars.ARM_SUBSCRIPTION_ID }}
          SUBSCRIPTION_ORDER: ${{ needs.subscriptions.outputs.subscriptionOrder }}
          JOB_INDEX: '0'
        run: *select-test-subscription

      - name: Prepare test environment
        id: test-environment
        shell: pwsh
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          VARS_CONTEXT: ${{ toJson(vars) }}
          SELECTED_SUBSCRIPTION_ID: ${{ steps.pick.outputs.subscriptionId }}
          SUBSCRIPTION_IDS: ${{ steps.pick.outputs.subscriptionIds }}
        run: *prepare-standard-test-environment

      - name: Download prepared authoring runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bootstrap.outputs.artifact }}
          path: ${{ runner.temp }}/avm-authoring

      - name: Validate required features offline
        id: required-features
        shell: pwsh
        env:
          SELECTED_SUBSCRIPTION_ID: ${{ steps.test-environment.outputs.subscriptionId }}
        run: &check-required-features |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath '.required-features.json' -PathType Leaf)) {
              Write-Host 'No .required-features.json found; feature-specific Azure login and registration will be skipped.'
              return
          }

          $features = ConvertFrom-Json -InputObject (Get-Content -LiteralPath '.required-features.json' -Raw) -NoEnumerate
          if ($features -isnot [array]) { throw '.required-features.json must be a JSON array.' }
          if ($features.Count -eq 0) {
              Write-Host '.required-features.json declares no features; feature-specific Azure login and registration will be skipped.'
              return
          }

          $selected = [guid]::Empty
          $effective = [guid]::Empty
          if (-not [guid]::TryParseExact($env:SELECTED_SUBSCRIPTION_ID, 'D', [ref]$selected) -or
              -not [guid]::TryParseExact($env:ARM_SUBSCRIPTION_ID, 'D', [ref]$effective) -or
              $selected -eq [guid]::Empty -or $selected -ne $effective) {
              throw 'The effective ARM_SUBSCRIPTION_ID does not match the selected test subscription; refusing feature registration.'
          }
          if ([string]::IsNullOrWhiteSpace($env:ARM_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:ARM_TENANT_ID)) {
              throw 'Feature registration requires the effective ARM_CLIENT_ID and ARM_TENANT_ID used by the tests.'
          }

          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          $preview = Register-AvmFeature -SubscriptionId $env:SELECTED_SUBSCRIPTION_ID -SkipModuleVersionCheck -WhatIf
          if ($preview.FeaturesTotal -ne $features.Count) {
              throw '.required-features.json changed during feature preflight.'
          }
          'required=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Validated all $($preview.FeaturesTotal) required Azure feature(s) in .required-features.json and the effective selected test subscription $selected. No Azure calls or feature registration occurred; Azure login and registration run in the following steps."

      - name: Azure login for required features
        if: steps.required-features.outputs.required == 'true'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ steps.test-environment.outputs.subscriptionId }}

      - name: Register required features
        if: steps.required-features.outputs.required == 'true'
        shell: pwsh
        env:
          SELECTED_SUBSCRIPTION_ID: ${{ steps.test-environment.outputs.subscriptionId }}
        run: &register-required-features |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          avm -SkipModuleVersionCheck register-features --subscription-id $env:SELECTED_SUBSCRIPTION_ID

      - name: Integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          avm -SkipModuleVersionCheck test integration

  discover-examples:
    name: Discover E2E tests
    if: github.event.repository.name != 'terraform-azurerm-avm-template'
    needs: bootstrap
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
      hasExamples: ${{ steps.list.outputs.hasExamples }}
      requiredExamples: ${{ steps.list.outputs.requiredExamples }}
      optionalExamples: ${{ steps.list.outputs.optionalExamples }}
      runRequired: ${{ steps.list.outputs.runRequired }}
      runOptional: ${{ steps.list.outputs.runOptional }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download prepared authoring runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bootstrap.outputs.artifact }}
          path: ${{ runner.temp }}/avm-authoring

      - name: List runnable examples
        id: list
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          $examples = (avm -SkipModuleVersionCheck test e2e --list | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($examples)) {
              throw [System.IO.InvalidDataException]::new('E2E discovery returned no JSON array.')
          }

          $parsed = ConvertFrom-Json -InputObject $examples -NoEnumerate
          if ($parsed -isnot [array] -or @($parsed | Where-Object { $_ -isnot [string] -or [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) {
              throw [System.IO.InvalidDataException]::new('E2E discovery must return an array of nonempty example names.')
          }
          $defaultNames = @('default', 'defaults')
          $requiredNames = @($defaultNames + 'waf-aligned')
          foreach ($name in $requiredNames) {
              if ((Test-Path -LiteralPath (Join-Path 'examples' $name) -PathType Container) -and $parsed -cnotcontains $name) {
                  throw [System.InvalidOperationException]::new("Required E2E example '$name' exists but is not runnable; remove its ignore marker or repair the example.")
              }
          }
          $required = @($parsed | Where-Object { $_ -cin $requiredNames })
          $optional = @($parsed | Where-Object { $_ -cnotin $requiredNames })
          $labels = @()
          if ($env:PR_LABELS -and $env:PR_LABELS -ne 'null') {
              $labels = @(ConvertFrom-Json -InputObject $env:PR_LABELS)
          }
          $trusted = $env:EVENT_NAME -eq 'workflow_dispatch' -or (
              $env:EVENT_NAME -eq 'pull_request' -and $env:IS_FORK -eq 'false'
          )
          $runRequired = $trusted -and (
              $env:EVENT_NAME -eq 'workflow_dispatch' -or
              $labels -ccontains 'PR: Run Required E2E Tests' -or $labels -ccontains 'PR: Run All E2E Tests'
          )
          $runOptional = $trusted -and (
              $env:EVENT_NAME -eq 'workflow_dispatch' -or $labels -ccontains 'PR: Run All E2E Tests'
          )
          $hasExamples = if ($parsed.Count -gt 0) { 'true' } else { 'false' }

          "examples=$examples" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "hasExamples=$hasExamples" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "requiredExamples=$(ConvertTo-Json -InputObject $required -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "optionalExamples=$(ConvertTo-Json -InputObject $optional -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "runRequired=$($runRequired.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "runOptional=$($runOptional.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Required E2E examples: $($required -join ', '); optional E2E examples: $($optional -join ', ')."
          if (@($parsed | Where-Object { $_ -cin $defaultNames }).Count -eq 0) {
              Write-Host "Required E2E examples 'default' or 'defaults' are absent; existence is not yet enforced."
          }
          if ($parsed -cnotcontains 'waf-aligned') { Write-Host "Required E2E example 'waf-aligned' is absent; existence is not yet enforced." }

  select-e2e-tests:
    name: Select E2E tests and subscriptions
    if: needs.discover-examples.outputs.runRequired == 'true' || needs.discover-examples.outputs.runOptional == 'true'
    needs: [subscriptions, discover-examples]
    runs-on: ubuntu-latest
    environment: examples-test-execution
    permissions: {}
    outputs:
      deploymentMatrix: ${{ steps.matrix.outputs.deploymentMatrix }}
    steps:
      - name: Select E2E subscriptions
        id: pool
        shell: pwsh
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.TEST_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          FALLBACK_SUBSCRIPTION_ID_SECRET: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          FALLBACK_SUBSCRIPTION_ID_VAR: ${{ vars.ARM_SUBSCRIPTION_ID }}
          SUBSCRIPTION_ORDER: ${{ needs.subscriptions.outputs.subscriptionOrder }}
          JOB_INDEX: '0'
        run: *select-test-subscription

      - name: Build E2E matrix
        id: matrix
        shell: pwsh
        env:
          SUBSCRIPTIONS: ${{ steps.pool.outputs.subscriptionIds }}
          SUBSCRIPTION_OVERRIDE: ${{ secrets.ARM_SUBSCRIPTION_ID_OVERRIDE || vars.ARM_SUBSCRIPTION_ID_OVERRIDE }}
          REQUIRED_EXAMPLES: ${{ needs.discover-examples.outputs.requiredExamples }}
          OPTIONAL_EXAMPLES: ${{ needs.discover-examples.outputs.optionalExamples }}
          RUN_OPTIONAL: ${{ needs.discover-examples.outputs.runOptional }}
        run: |
          $ErrorActionPreference = 'Stop'
          $subscriptions = @(ConvertFrom-Json -InputObject $env:SUBSCRIPTIONS)
          if ($subscriptions.Count -eq 0) {
              throw [System.InvalidOperationException]::new('E2E selection requires a nonempty General subscription pool.')
          }
          $overrideName = ''
          if (-not [string]::IsNullOrWhiteSpace($env:SUBSCRIPTION_OVERRIDE)) {
              $identifier = [guid]::Empty
              if (-not [guid]::TryParseExact($env:SUBSCRIPTION_OVERRIDE, 'D', [ref]$identifier) -or $identifier -eq [guid]::Empty) {
                  throw [System.ArgumentException]::new('ARM_SUBSCRIPTION_ID_OVERRIDE must be a nonempty subscription GUID.')
              }
              $override = @($subscriptions | Where-Object { $_.id -eq $env:SUBSCRIPTION_OVERRIDE })
              $overrideName = if ($override.Count -eq 1 -and $override[0].name -ne $override[0].id) { $override[0].name } else { 'subscription override' }
          }
          $required = ConvertFrom-Json -InputObject $env:REQUIRED_EXAMPLES -NoEnumerate
          $optional = ConvertFrom-Json -InputObject $env:OPTIONAL_EXAMPLES -NoEnumerate
          if ($required -isnot [array] -or $optional -isnot [array] -or $env:RUN_OPTIONAL -cnotin @('true', 'false')) {
              throw [System.IO.InvalidDataException]::new('E2E matrix selection requires example arrays and a Boolean optional selection.')
          }
          $examples = @($required)
          if ($env:RUN_OPTIONAL -ceq 'true') { $examples += $optional }
          $matrix = @(
              for ($index = 0; $index -lt $examples.Count; $index++) {
                  $subscription = $subscriptions[$index % $subscriptions.Count]
                  $name = if ($overrideName) { $overrideName } elseif ($subscription.name -ne $subscription.id) { $subscription.name } else { 'subscription' }
                  [pscustomobject]@{
                      Name = $examples[$index]
                      SubscriptionIndex = $index
                      SubscriptionName = $name
                      IsRequired = $required -ccontains $examples[$index]
                  }
              }
          )
          "deploymentMatrix=$(ConvertTo-Json -InputObject $matrix -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  e2e-test:
    name: "E2E test (${{ matrix.testCase.IsRequired && 'required' || 'optional' }}): ${{ matrix.testCase.Name }} - ${{ matrix.testCase.SubscriptionName }}"
    if: >-
      github.event.repository.name != 'terraform-azurerm-avm-template' &&
      needs.discover-examples.outputs.runRequired == 'true' &&
      needs.select-e2e-tests.outputs.deploymentMatrix != '[]'
    needs: [bootstrap, subscriptions, discover-examples, select-e2e-tests]
    runs-on: ubuntu-latest
    environment: examples-test-execution
    permissions:
      id-token: write
      contents: read
    strategy:
      # Every failing example must be reported, and every deployed example must
      # be destroyed - not just the first one to fail.
      fail-fast: false
      matrix:
        testCase: ${{ fromJson(needs.select-e2e-tests.outputs.deploymentMatrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AVM tool cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $avmHome = Join-Path $env:RUNNER_TEMP 'avm-home'
          $cache = Join-Path $env:RUNNER_TEMP 'tf-plugin-cache'
          New-Item -ItemType Directory -Force -Path $avmHome, $cache | Out-Null
          "AVM_HOME=$avmHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TF_PLUGIN_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Select subscription for this example
        id: leg
        shell: pwsh
        env:
          TEST_SUBSCRIPTION_IDS: ${{ vars.TEST_SUBSCRIPTION_IDS || secrets.TEST_SUBSCRIPTION_IDS }}
          FALLBACK_SUBSCRIPTION_ID_SECRET: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          FALLBACK_SUBSCRIPTION_ID_VAR: ${{ vars.ARM_SUBSCRIPTION_ID }}
          SUBSCRIPTION_ORDER: ${{ needs.subscriptions.outputs.subscriptionOrder }}
          JOB_INDEX: ${{ matrix.testCase.SubscriptionIndex }}
        run: *select-test-subscription

      - name: Prepare test environment
        id: test-environment
        shell: pwsh
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          VARS_CONTEXT: ${{ toJson(vars) }}
          SELECTED_SUBSCRIPTION_ID: ${{ steps.leg.outputs.subscriptionId }}
          SUBSCRIPTION_IDS: ${{ steps.leg.outputs.subscriptionIds }}
        run: |
          $ErrorActionPreference = 'Stop'

          $protected = @(
              'PATH','HOME','USER','PWD','SHELL','LANG','LC_ALL','TMPDIR','TEMP','TMP',
              'CI','GITHUB_ACTIONS','GITHUB_ENV','GITHUB_PATH','GITHUB_OUTPUT',
              'GITHUB_STATE','GITHUB_STEP_SUMMARY','GITHUB_WORKSPACE','GITHUB_TOKEN',
              'RUNNER_TEMP','RUNNER_TOOL_CACHE','RUNNER_WORKSPACE','RUNNER_OS',
              'RUNNER_ARCH','RUNNER_NAME','RUNNER_DEBUG',
              'ACTIONS_ID_TOKEN_REQUEST_TOKEN','ACTIONS_ID_TOKEN_REQUEST_URL',
              'ACTIONS_RUNTIME_TOKEN','ACTIONS_RUNTIME_URL','ACTIONS_CACHE_URL',
              'AVM_HOME','TF_PLUGIN_CACHE_DIR'
          )

          function ConvertFrom-Context {
              param([string] $Json)
              if ([string]::IsNullOrWhiteSpace($Json)) { return @{} }
              return ($Json | ConvertFrom-Json -AsHashtable)
          }

          $secretsMap = ConvertFrom-Context $env:SECRETS_CONTEXT
          $varsMap = ConvertFrom-Context $env:VARS_CONTEXT

          $combined = @{}
          foreach ($k in $varsMap.Keys) { $combined[$k] = $varsMap[$k] }
          foreach ($k in $secretsMap.Keys) { $combined[$k] = $secretsMap[$k] }
          foreach ($name in 'ARM_CLIENT_ID', 'ARM_TENANT_ID', 'TEST_SUBSCRIPTION_IDS') {
              if (-not [string]::IsNullOrEmpty([string] $varsMap[$name])) {
                  $combined[$name] = $varsMap[$name]
              }
          }

          $subOverride = [string] $combined['ARM_SUBSCRIPTION_ID_OVERRIDE']
          if ([string]::IsNullOrWhiteSpace($subOverride)) {
              $allowedSubscriptions = @($env:SUBSCRIPTION_IDS | ConvertFrom-Json)
              if ($allowedSubscriptions.Count -eq 0 -or
                  $env:SELECTED_SUBSCRIPTION_ID -notin @($allowedSubscriptions.id)) {
                  throw [System.InvalidOperationException]::new('The selected subscription must belong to the published General test pool.')
              }
          }
          else {
              $subscription = [guid]::Empty
              if (-not [guid]::TryParseExact($subOverride, 'D', [ref]$subscription) -or $subscription -eq [guid]::Empty) {
                  throw [System.ArgumentException]::new('ARM_SUBSCRIPTION_ID_OVERRIDE must be a nonempty subscription GUID.')
              }
          }
          $combined['TEST_SUBSCRIPTION_IDS'] = $env:SUBSCRIPTION_IDS

          foreach ($key in $combined.Keys) {
              if ($key -eq 'github_token') { continue }
              if ($protected -contains $key.ToUpperInvariant()) {
                  Write-Host "Skipping protected name '$key'."
                  continue
              }
              $value = [string] $combined[$key]
              $delim = "AVM_ENV_$([guid]::NewGuid().ToString('N'))"
              "$key<<$delim`n$value`n$delim" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          if (-not [string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)) {
              "ARM_OIDC_REQUEST_TOKEN=$($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          if (-not [string]::IsNullOrWhiteSpace($env:ACTIONS_ID_TOKEN_REQUEST_URL)) {
              "ARM_OIDC_REQUEST_URL=$($env:ACTIONS_ID_TOKEN_REQUEST_URL)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          foreach ($name in 'ARM_CLIENT_ID', 'ARM_TENANT_ID', 'ARM_SUBSCRIPTION_ID') {
              $override = [string] $combined["${name}_OVERRIDE"]
              if (-not [string]::IsNullOrWhiteSpace($override)) {
                  "$name=$override" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
          }

          $subOverride = [string] $combined['ARM_SUBSCRIPTION_ID_OVERRIDE']
          if ([string]::IsNullOrWhiteSpace($subOverride) -and -not [string]::IsNullOrWhiteSpace($env:SELECTED_SUBSCRIPTION_ID)) {
              "ARM_SUBSCRIPTION_ID=$($env:SELECTED_SUBSCRIPTION_ID)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $effectiveSubscription = if ([string]::IsNullOrWhiteSpace($subOverride)) { $env:SELECTED_SUBSCRIPTION_ID } else { $subOverride }
          "subscriptionId=$effectiveSubscription" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare Azure Local environment lock
        id: azure-local-lock
        shell: pwsh
        env:
          LOCK_CONFIG: ${{ vars.AVM_AZURE_LOCAL_ENVIRONMENT_LOCK }}
          LOCK_MODE: ${{ vars.AVM_AZURE_LOCAL_ENVIRONMENT_MODE }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_NAME: ${{ github.job }}
          MATRIX_JOB_INDEX: ${{ strategy.job-index }}
          E2E_EXAMPLE: ${{ matrix.testCase.Name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = $env:LOCK_CONFIG
          if ([string]::IsNullOrWhiteSpace($raw)) {
              'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              return
          }
          if ($env:LOCK_MODE -cnotin @('consumer', 'lifecycle', 'migration')) {
              throw [ArgumentException]::new('AVM_AZURE_LOCAL_ENVIRONMENT_MODE must accompany the lock configuration.')
          }
          if ($env:LOCK_MODE -cne 'consumer') {
              throw [InvalidOperationException]::new(
                  "Azure Local '$($env:LOCK_MODE)' repositories require their module-specific lifecycle contract; consumer readiness is not a substitute."
              )
          }

          $document = $null
          try {
              $document = [Text.Json.JsonDocument]::Parse($raw)
              if ($document.RootElement.ValueKind -ne [Text.Json.JsonValueKind]::Object) {
                  throw [ArgumentException]::new('AVM_AZURE_LOCAL_ENVIRONMENT_LOCK must be a JSON object.')
              }
              $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
              foreach ($property in $document.RootElement.EnumerateObject()) {
                  if (-not $seen.Add($property.Name)) {
                      throw [ArgumentException]::new('AVM_AZURE_LOCAL_ENVIRONMENT_LOCK contains duplicate properties.')
                  }
              }
              $expected = @(
                  'schemaVersion', 'storageAccountResourceId', 'containerName',
                  'blobName', 'fixtureResourceGroupId'
              )
              $unexpected = @($seen | Where-Object { $_ -cnotin $expected })
              $missing = @($expected | Where-Object { $_ -cnotin $seen })
              if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
                  throw [ArgumentException]::new('AVM_AZURE_LOCAL_ENVIRONMENT_LOCK must contain exactly the five version 1 properties.')
              }
              $config = ConvertFrom-Json -InputObject $raw -AsHashtable -NoEnumerate -ErrorAction Stop
          }
          finally {
              if ($null -ne $document) { $document.Dispose() }
          }
          if ($config['schemaVersion'] -isnot [int] -and $config['schemaVersion'] -isnot [long] -or
              $config['schemaVersion'] -ne 1) {
              throw [ArgumentException]::new('AVM_AZURE_LOCAL_ENVIRONMENT_LOCK schemaVersion must be 1.')
          }

          $fixtureMatch = [regex]::Match(
              [string]$config['fixtureResourceGroupId'],
              '\A/subscriptions/(?<id>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/resourceGroups/[^/]+\z',
              [Text.RegularExpressions.RegexOptions]::IgnoreCase
          )
          $fixtureSubscription = [guid]::Empty
          if (-not $fixtureMatch.Success -or
              -not [guid]::TryParseExact($fixtureMatch.Groups['id'].Value, 'D', [ref]$fixtureSubscription)) {
              throw [ArgumentException]::new('fixtureResourceGroupId must contain one exact subscription GUID.')
          }
          $subscriptionId = $fixtureSubscription.ToString('D')
          $subscriptionKey = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($subscriptionId))
          ).ToLowerInvariant()
          $testSubscriptionEntries = @(
              [pscustomobject]@{ id = $subscriptionId; name = 'Azure Local'; tag = 'Azure Local' }
          )
          $testSubscriptions = ConvertTo-Json -InputObject $testSubscriptionEntries -Compress
          $ownerIdentity = @(
              $env:REPOSITORY, $env:WORKFLOW_REF, $env:RUN_ID, $env:RUN_ATTEMPT,
              $env:JOB_NAME, $env:MATRIX_JOB_INDEX, $env:E2E_EXAMPLE
          ) -join '|'
          $ownerHash = [Convert]::ToHexString(
              [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($ownerIdentity))
          ).ToLowerInvariant()

          'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mode=$env:LOCK_MODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "storageAccountResourceId=$($config['storageAccountResourceId'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "fixtureResourceGroupId=$($config['fixtureResourceGroupId'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "containerName=$($config['containerName'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "blobName=$($config['blobName'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "subscriptionId=$subscriptionId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "subscriptionKey=$subscriptionKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ownerHash=$ownerHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "testSubscriptionIds=$testSubscriptions" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out Azure Local readiness helper
        if: steps.azure-local-lock.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azure/bicep-registry-modules
          ref: d556b8c5d70ff0646168f21e8807087ce2e1c3dd
          path: .avm-bicep-registry
          persist-credentials: false

      - name: Sign in for Azure Local environment access
        if: steps.azure-local-lock.outputs.enabled == 'true'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ steps.azure-local-lock.outputs.subscriptionId }}
          enable-AzPSSession: true

      - name: Inspect Azure Local environment lock
        id: azure-local-lock-status
        if: steps.azure-local-lock.outputs.enabled == 'true'
        uses: Azure/azure-verified-modules-tools/.github/actions/azure-local-environment-lease@ed65b1e2c6168c366be694fa13fb8a07c85b1dff
        with:
          operation: status
          storageAccountResourceId: ${{ steps.azure-local-lock.outputs.storageAccountResourceId }}
          fixtureResourceGroupId: ${{ steps.azure-local-lock.outputs.fixtureResourceGroupId }}
          containerName: ${{ steps.azure-local-lock.outputs.containerName }}
          blobName: ${{ steps.azure-local-lock.outputs.blobName }}
          ownerHash: ${{ steps.azure-local-lock.outputs.ownerHash }}
          mode: consumer

      - name: Acquire Azure Local environment lock
        id: azure-local-lock-acquire
        if: steps.azure-local-lock.outputs.enabled == 'true'
        uses: Azure/azure-verified-modules-tools/.github/actions/azure-local-environment-lease@ed65b1e2c6168c366be694fa13fb8a07c85b1dff
        with:
          operation: acquire
          storageAccountResourceId: ${{ steps.azure-local-lock.outputs.storageAccountResourceId }}
          fixtureResourceGroupId: ${{ steps.azure-local-lock.outputs.fixtureResourceGroupId }}
          containerName: ${{ steps.azure-local-lock.outputs.containerName }}
          blobName: ${{ steps.azure-local-lock.outputs.blobName }}
          ownerHash: ${{ steps.azure-local-lock.outputs.ownerHash }}
          expectedGeneration: ${{ steps.azure-local-lock-status.outputs.fixtureGeneration }}
          mode: consumer

      - name: Project Azure Local environment readiness
        id: azure-local-projection
        if: steps.azure-local-lock.outputs.enabled == 'true'
        shell: pwsh
        env:
          BRM_ROOT: ${{ github.workspace }}/.avm-bicep-registry
          TEST_SUBSCRIPTION_IDS: ${{ steps.azure-local-lock.outputs.testSubscriptionIds }}
          SUBSCRIPTION_KEY: ${{ steps.azure-local-lock.outputs.subscriptionKey }}
          OWNER_HASH: ${{ steps.azure-local-lock.outputs.ownerHash }}
          EXPECTED_GENERATION: ${{ steps.azure-local-lock-status.outputs.fixtureGeneration }}
          GITHUB_VARIABLES: ${{ toJSON(vars) }}
          GITHUB_SECRETS: ${{ toJSON(secrets) }}
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:BRM_ROOT 'utilities' 'pipelines' 'sharedScripts' 'Write-HciEnvironmentProjection.ps1')
          $outputPath = Join-Path $env:RUNNER_TEMP "avm-hci-$($env:OWNER_HASH).json"
          $parameters = @{
              RepoRootPath = $env:BRM_ROOT
              TestSubscriptionIds = $env:TEST_SUBSCRIPTION_IDS
              SubscriptionKey = $env:SUBSCRIPTION_KEY
              TenantId = [guid]$env:ARM_TENANT_ID
              Owner = $env:OWNER_HASH
              OutputPath = $outputPath
              GitHubVariables = $env:GITHUB_VARIABLES
              GitHubSecrets = $env:GITHUB_SECRETS
          }
          if (-not [string]::IsNullOrWhiteSpace($env:CI_KEY_VAULT_NAME)) {
              $parameters.KeyVaultName = $env:CI_KEY_VAULT_NAME
          }
          $projection = Write-HciEnvironmentProjection @parameters
          if ($projection.generation -cne $env:EXPECTED_GENERATION) {
              throw 'The Azure Local projection generation no longer matches the acquired environment lock.'
          }
          $projectionJson = $projection | ConvertTo-Json -Depth 5 -Compress
          $delimiter = "AVM_HCI_$([guid]::NewGuid().ToString('N'))"
          "AVM_AZURE_LOCAL_ENVIRONMENT<<$delimiter`n$projectionJson`n$delimiter" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARM_SUBSCRIPTION_ID=$($projection.subscriptionId)" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TF_VAR_subscription_id=$($projection.subscriptionId)" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download prepared authoring runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bootstrap.outputs.artifact }}
          path: ${{ runner.temp }}/avm-authoring

      - name: Validate required features offline
        id: required-features
        shell: pwsh
        env:
          SELECTED_SUBSCRIPTION_ID: ${{ steps.azure-local-lock.outputs.enabled == 'true' && steps.azure-local-lock.outputs.subscriptionId || steps.test-environment.outputs.subscriptionId }}
        run: *check-required-features

      - name: Azure login for required features
        if: steps.required-features.outputs.required == 'true'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ steps.azure-local-lock.outputs.enabled == 'true' && steps.azure-local-lock.outputs.subscriptionId || steps.test-environment.outputs.subscriptionId }}

      - name: Register required features
        if: steps.required-features.outputs.required == 'true'
        shell: pwsh
        env:
          SELECTED_SUBSCRIPTION_ID: ${{ steps.azure-local-lock.outputs.enabled == 'true' && steps.azure-local-lock.outputs.subscriptionId || steps.test-environment.outputs.subscriptionId }}
        run: *register-required-features

      - name: Run end-to-end tests
        id: e2e
        shell: pwsh
        env:
          E2E_EXAMPLE: ${{ matrix.testCase.Name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'avm-authoring' 'Avm.Authoring.psd1') -ErrorAction Stop
          $result = avm -SkipModuleVersionCheck test e2e --example $env:E2E_EXAMPLE --passthru
          if ($result.Status -cne 'pass' -or $result.FilesProcessed -ne 1) {
              throw [System.InvalidOperationException]::new("E2E example '$env:E2E_EXAMPLE' did not execute successfully.")
          }

      - name: Release Azure Local environment lock
        if: >-
          always() &&
          steps.azure-local-lock-acquire.outputs.acquired == 'true' &&
          (
            steps.azure-local-projection.outcome == 'failure' ||
            (
              steps.azure-local-projection.outcome == 'success' &&
              steps.e2e.outcome == 'success'
            )
          )
        uses: Azure/azure-verified-modules-tools/.github/actions/azure-local-environment-lease@ed65b1e2c6168c366be694fa13fb8a07c85b1dff
        with:
          operation: release
          storageAccountResourceId: ${{ steps.azure-local-lock.outputs.storageAccountResourceId }}
          fixtureResourceGroupId: ${{ steps.azure-local-lock.outputs.fixtureResourceGroupId }}
          containerName: ${{ steps.azure-local-lock.outputs.containerName }}
          blobName: ${{ steps.azure-local-lock.outputs.blobName }}
          ownerHash: ${{ steps.azure-local-lock.outputs.ownerHash }}
          expectedGeneration: ${{ steps.azure-local-lock-status.outputs.fixtureGeneration }}
          mode: consumer
          cleanupConfirmed: 'true'

  module-gate:
    name: Report check status
    if: always()
    needs: [bootstrap, subscriptions, unit-test, pr-check, pr-check-fork, integration-test, discover-examples, select-e2e-tests, e2e-test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Evaluate and report check status
        uses: Azure/azure-verified-modules-tools/.github/actions/report-check-status@322cc3a73b18b7757732263c3d27ff3c6ae890c6
        with:
          ecosystem: terraform
          results: ${{ toJSON(needs) }}
