              $status = if ($result) { $result.Status } else { '<none>' }
              throw "avm test integration failed (status: $status)."
          }

  e2e-test:
    name: End-to-end tests
    if: github.event.repository.name != 'terraform-azurerm-avm-template' && github.event.pull_request.head.repo.fork == false
    needs: subscriptions
    runs-on: ubuntu-latest
    environment: examples-test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
