name: Rerun PR check
description: Rerun the matching pull_request PR check after an E2E label event.
inputs:
  pullRequestNumber:
    description: Pull request number from the label event.
    required: true
  expectedHeadSha:
    description: Pull request head commit from the label event.
    required: true
  expectedBaseSha:
    description: Pull request base commit from the label event.
    required: true
  dispatcherRunId:
    description: pull_request_target workflow run ID handling the label event.
    required: true
  workflowPath:
    description: Caller pull_request workflow path.
    required: false
    default: .github/workflows/pr-check.yml
outputs:
  outcome:
    description: Requested rerun or the reason no rerun was needed.
    value: ${{ steps.rerun.outputs.outcome }}
  runId:
    description: Selected pull_request workflow run ID, when selected.
    value: ${{ steps.rerun.outputs.runId }}
runs:
  using: composite
  steps:
    - name: Rerun matching PR check
      id: rerun
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        PULL_REQUEST_NUMBER: ${{ inputs.pullRequestNumber }}
        EXPECTED_HEAD_SHA: ${{ inputs.expectedHeadSha }}
        EXPECTED_BASE_SHA: ${{ inputs.expectedBaseSha }}
        DISPATCHER_RUN_ID: ${{ inputs.dispatcherRunId }}
        WORKFLOW_PATH: ${{ inputs.workflowPath }}
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const pullRequestNumber = parsePositiveInteger(process.env.PULL_REQUEST_NUMBER, 'pull request number');
          const dispatcherRunId = parsePositiveInteger(process.env.DISPATCHER_RUN_ID, 'dispatcher run ID');
          const expectedHeadSha = parseCommit(process.env.EXPECTED_HEAD_SHA, 'head');
          const expectedBaseSha = parseCommit(process.env.EXPECTED_BASE_SHA, 'base');
          const workflowPath = process.env.WORKFLOW_PATH;
          if (!/^\.github\/workflows\/[A-Za-z0-9._-]+\.ya?ml$/.test(workflowPath)) {
            throw new Error(`Invalid PR-check workflow path '${workflowPath}'.`);
          }
          const workflowFile = workflowPath.split('/').at(-1);
          const requiredLabels = new Set([
            'PR: Run Required E2E Tests',
            'PR: Run All E2E Tests'
          ]);
          const maxUnavailableAttempts = 12;
          const maxCompletionAttempts = 1080;
          const pollIntervalMilliseconds = 10000;

          function parsePositiveInteger(value, name) {
            if (!/^[1-9]\d*$/.test(value)) throw new Error(`Invalid ${name} '${value}'.`);
            const parsed = Number(value);
            if (!Number.isSafeInteger(parsed)) throw new Error(`${name} '${value}' is out of range.`);
            return parsed;
          }

          function parseCommit(value, name) {
            if (!/^[0-9a-f]{40}$/.test(value)) throw new Error(`Invalid pull request ${name} commit '${value}'.`);
            return value;
          }

          function parseDate(value, name) {
            const parsed = Date.parse(value);
            if (!Number.isFinite(parsed)) throw new Error(`Invalid ${name} '${value}'.`);
            return parsed;
          }

          async function request(description, operation) {
            try {
              return await operation();
            } catch (error) {
              throw new Error(`${description}: ${error instanceof Error ? error.message : String(error)}`);
            }
          }

          async function getLivePullRequest() {
            const response = await request(
              `Failed to read pull request #${pullRequestNumber}`,
              () => github.rest.pulls.get({ owner, repo, pull_number: pullRequestNumber })
            );
            const pullRequest = response.data;
            if (!pullRequest || pullRequest.state !== 'open') {
              throw new Error(`Pull request #${pullRequestNumber} is not open.`);
            }
            if (!pullRequest.head?.repo || !pullRequest.base?.repo ||
                !Number.isSafeInteger(Number(pullRequest.head.repo.id)) ||
                !Number.isSafeInteger(Number(pullRequest.base.repo.id))) {
              throw new Error(`Pull request #${pullRequestNumber} has invalid repository metadata.`);
            }
            if (Number(pullRequest.head.repo.id) !== Number(pullRequest.base.repo.id)) {
              throw new Error(`Pull request #${pullRequestNumber} is from a fork; privileged label reruns are disabled.`);
            }
            if (pullRequest.head.sha !== expectedHeadSha) {
              core.info(`The pull request head changed to ${pullRequest.head.sha}; its synchronize run will evaluate the current labels.`);
              return null;
            }
            if (pullRequest.base.sha !== expectedBaseSha) {
              throw new Error(
                `The pull request base changed from ${expectedBaseSha} to ${pullRequest.base.sha} while selecting a PR-check run.`
              );
            }
            return pullRequest;
          }

          async function getLiveLabels() {
            const labels = await request(
              `Failed to read current labels for pull request #${pullRequestNumber}`,
              () => github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner,
                repo,
                issue_number: pullRequestNumber,
                per_page: 100
              })
            );
            if (!Array.isArray(labels)) {
              throw new Error(`GitHub returned an invalid label collection for pull request #${pullRequestNumber}.`);
            }
            return labels.map((label, index) => {
              if (!label || typeof label.name !== 'string' || !label.name) {
                throw new Error(
                  `GitHub returned an invalid label at index ${index} for pull request #${pullRequestNumber}.`
                );
              }
              return label.name;
            });
          }

          async function getMatchingRuns(pullRequest) {
            const runs = await request(
              `Failed to list PR-check runs for pull request #${pullRequestNumber}`,
              () => github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: workflowFile,
                event: 'pull_request',
                head_sha: pullRequest.head.sha,
                per_page: 100
              })
            );
            if (!Array.isArray(runs)) {
              throw new Error(`GitHub returned an invalid workflow run collection for pull request #${pullRequestNumber}.`);
            }
            return runs.filter(run => matchesPullRequest(run, pullRequest)).sort(compareRuns);
          }

          function matchesPullRequest(run, pullRequest) {
            if (run.event !== 'pull_request' ||
                run.path !== workflowPath ||
                run.head_sha !== pullRequest.head.sha ||
                run.head_branch !== pullRequest.head.ref ||
                !Array.isArray(run.pull_requests)) {
              return false;
            }
            const matches = run.pull_requests.filter(candidate =>
              candidate?.number === pullRequestNumber &&
              candidate.head?.sha === pullRequest.head.sha &&
              candidate.head?.ref === pullRequest.head.ref &&
              Number(candidate.head?.repo?.id) === Number(pullRequest.head.repo.id) &&
              candidate.base?.sha === pullRequest.base.sha &&
              candidate.base?.ref === pullRequest.base.ref &&
              Number(candidate.base?.repo?.id) === Number(pullRequest.base.repo.id)
            );
            return matches.length === 1;
          }

          function compareRuns(left, right) {
            const createdDifference =
              parseDate(right.created_at, `workflow run ${right.id} creation time`) -
              parseDate(left.created_at, `workflow run ${left.id} creation time`);
            if (createdDifference !== 0) return createdDifference;
            const leftId = BigInt(String(left.id));
            const rightId = BigInt(String(right.id));
            return leftId === rightId ? 0 : leftId < rightId ? 1 : -1;
          }

          function finish(outcome, runId = '') {
            core.setOutput('outcome', outcome);
            core.setOutput('runId', runId);
          }

          const dispatcher = await request(
            `Failed to read dispatcher run ${dispatcherRunId}`,
            () => github.rest.actions.getWorkflowRun({ owner, repo, run_id: dispatcherRunId })
          );
          if (dispatcher.data?.event !== 'pull_request_target') {
            throw new Error(`Dispatcher run ${dispatcherRunId} is not a pull_request_target run.`);
          }
          const dispatcherStartedAt = parseDate(
            dispatcher.data.run_started_at,
            `dispatcher run ${dispatcherRunId} start time`
          );

          let unavailablePolls = 0;
          for (let poll = 0; poll < maxCompletionAttempts; poll++) {
            const pullRequest = await getLivePullRequest();
            if (!pullRequest) {
              finish('head-changed');
              return;
            }

            const labels = await getLiveLabels();
            if (!labels.some(label => requiredLabels.has(label))) {
              core.info('The E2E label is no longer present; no rerun is needed.');
              finish('label-removed');
              return;
            }

            const matchingRuns = await getMatchingRuns(pullRequest);
            if (matchingRuns.length === 0) {
              unavailablePolls++;
              if (unavailablePolls >= maxUnavailableAttempts) {
                throw new Error(
                  `No PR-check run matched pull request #${pullRequestNumber} at head ` +
                  `${expectedHeadSha} and base ${expectedBaseSha}.`
                );
              }
              await new Promise(resolve => setTimeout(resolve, pollIntervalMilliseconds));
              continue;
            }

            unavailablePolls = 0;
            const latestRun = matchingRuns[0];
            const latestRunStartedAt = parseDate(
              latestRun.run_started_at,
              `workflow run ${latestRun.id} start time`
            );
            const activeRuns = matchingRuns.filter(run => run.status !== 'completed');
            const olderActiveRuns = activeRuns.filter(run =>
              parseDate(run.run_started_at, `workflow run ${run.id} start time`) < dispatcherStartedAt
            );
            if (latestRunStartedAt >= dispatcherStartedAt && olderActiveRuns.length === 0) {
              core.info(
                `PR-check run ${latestRun.id} already started after this label event at ` +
                `${latestRun.run_started_at}; no additional rerun is needed.`
              );
              finish('already-observed', String(latestRun.id));
              return;
            }
            if (activeRuns.length > 0) {
              core.info(`Waiting for ${activeRuns.length} active PR-check run(s) for head ${expectedHeadSha}.`);
              await new Promise(resolve => setTimeout(resolve, pollIntervalMilliseconds));
              continue;
            }
            if (latestRunStartedAt >= dispatcherStartedAt) {
              core.info(`PR-check run ${latestRun.id} completed after this label event; no additional rerun is needed.`);
              finish('already-observed', String(latestRun.id));
              return;
            }

            const verifiedPullRequest = await getLivePullRequest();
            if (!verifiedPullRequest) {
              finish('head-changed');
              return;
            }
            const verifiedLabels = await getLiveLabels();
            if (!verifiedLabels.some(label => requiredLabels.has(label))) {
              core.info('The E2E label was removed before rerun; no rerun is needed.');
              finish('label-removed');
              return;
            }
            const verifiedRuns = await getMatchingRuns(verifiedPullRequest);
            const verifiedLatestRun = verifiedRuns[0];
            if (!verifiedLatestRun ||
                String(verifiedLatestRun.id) !== String(latestRun.id) ||
                verifiedLatestRun.status !== 'completed') {
              core.info('The PR-check run set changed during verification; selecting it again.');
              continue;
            }

            await request(
              `Failed to rerun PR-check run ${latestRun.id}`,
              () => github.rest.actions.reRunWorkflow({ owner, repo, run_id: Number(latestRun.id) })
            );
            core.info(`Requested a rerun of PR-check run ${latestRun.id} for pull request #${pullRequestNumber}.`);
            finish('rerun-requested', String(latestRun.id));
            return;
          }

          throw new Error(`Timed out waiting for PR-check runs for pull request #${pullRequestNumber}.`);
