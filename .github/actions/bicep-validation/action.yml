name: Bicep package validation
description: Run the packaged static tier or one required/advisory PSRule matrix leg.
inputs:
  operation:
    description: Static or Policy.
    required: true
  avm-authoring-version:
    description: Exact qualified Avm.Authoring release.
    required: true
  modulePath:
    description: Caller-relative module path.
    required: true
  example:
    description: Exact module-relative policy test path.
    required: false
  baseline:
    description: Exact policy baseline name.
    required: false
runs:
  using: composite
  steps:
    - name: Prepare validation dependencies
      id: setup
      shell: pwsh
      env:
        AVM_ACTION_PATH: ${{ github.action_path }}
        AVM_AUTHORING_VERSION: ${{ inputs.avm-authoring-version }}
        OPERATION: ${{ inputs.operation }}
        MODULE_PATH: ${{ inputs.modulePath }}
        EXAMPLE: ${{ inputs.example }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        $root = [IO.Path]::GetFullPath((Join-Path $env:AVM_ACTION_PATH '..' '..' '..'))
        . (Join-Path $root 'scripts' 'bicep-workflows' 'Common.ps1')
        if ($env:OPERATION -cnotin @('Static', 'Policy')) { throw 'Unknown Bicep validation operation.' }
        $modulePath = Resolve-AvmWorkflowPath -Root $env:GITHUB_WORKSPACE -RelativePath $env:MODULE_PATH
        Initialize-AvmWorkflow -Version $env:AVM_AUTHORING_VERSION -Profile $env:OPERATION -Path $modulePath -Confirm:$false
        $key = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$env:MODULE_PATH|$env:EXAMPLE|$env:BASELINE"))).ToLowerInvariant()
        Write-AvmWorkflowOutput -Name artifactKey -Value "$env:OPERATION-$key"
    - name: Run package validation
      shell: pwsh
      env:
        AVM_ACTION_PATH: ${{ github.action_path }}
        OPERATION: ${{ inputs.operation }}
        MODULE_PATH: ${{ inputs.modulePath }}
        EXAMPLE: ${{ inputs.example }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        $root = [IO.Path]::GetFullPath((Join-Path $env:AVM_ACTION_PATH '..' '..' '..'))
        . (Join-Path $root 'scripts' 'bicep-workflows' 'Validation.ps1')
        Import-AvmWorkflowPackage
        $parameters = @{
          Root = $env:GITHUB_WORKSPACE; ModulePath = $env:MODULE_PATH
          ResultDirectory = Join-Path $env:RUNNER_TEMP 'avm-bicep-results'
        }
        if ($env:OPERATION -ceq 'Static') { Invoke-AvmWorkflowStaticValidation @parameters }
        else { Invoke-AvmWorkflowPolicyValidation @parameters -Example $env:EXAMPLE -Baseline $env:BASELINE }
    - name: Retain validation results
      if: always() && steps.setup.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bicep-${{ steps.setup.outputs.artifactKey }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/avm-bicep-results/*.json
        if-no-files-found: warn
        retention-days: 14
