name: Report AVM check status
description: Evaluate ecosystem check results and publish shared E2E authorization feedback without checking out PR code.
inputs:
  ecosystem:
    description: The bicep or terraform check policy.
    required: true
  results:
    description: JSON needs context containing the ecosystem's completed check jobs.
    required: true
  require-e2e:
    description: Whether Bicep must enforce E2E selection; manual static-only runs use false.
    default: 'true'
  fork-run:
    description: Report a completed fork check from a trusted workflow_run event.
    default: 'false'
  token:
    description: GitHub token with permissions required for the selected reporting mode.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Evaluate and report check status
      shell: pwsh
      env:
        REPORT_ECOSYSTEM: ${{ inputs.ecosystem }}
        REPORT_RESULTS: ${{ inputs.results }}
        REPORT_REQUIRE_E2E: ${{ inputs.require-e2e }}
        REPORT_FORK_RUN: ${{ inputs.fork-run }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:REPORT_FORK_RUN -cnotin @('true', 'false')) { throw 'fork-run must be true or false.' }
        $root = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_ACTION_PATH '..' '..' '..'))
        $module = Import-Module (Join-Path $root 'src' 'Avm.Authoring' 'Avm.Authoring.psd1') -PassThru
        $report = & $module {
          param($Root)
          . (Join-Path $Root 'scripts' 'workflow-reporting' 'Invoke-AvmWorkflowReport.ps1')
          if ($env:REPORT_FORK_RUN -ceq 'true') {
            if ($env:GITHUB_EVENT_NAME -cne 'workflow_run') { throw 'Fork reporting requires a workflow_run event.' }
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json -AsHashtable
            Invoke-AvmForkWorkflowReport -Event $event -Repository $env:GITHUB_REPOSITORY -ServerUrl $env:GITHUB_SERVER_URL
            return
          }
          Invoke-AvmWorkflowReport -Ecosystem $env:REPORT_ECOSYSTEM -ResultsJson $env:REPORT_RESULTS -RequireE2e $env:REPORT_REQUIRE_E2E
        } $root
        if ($env:REPORT_FORK_RUN -cne 'true' -and -not $report.Passed) { exit 1 }
