name: Bicep workflow matrix
description: Select changed or requested modules without running validation or deployment.
inputs:
  baseCommit:
    description: Previous commit SHA for push events; pull requests derive the tested merge's first parent.
    required: false
  targetCommit:
    description: Full target commit SHA.
    required: true
  pullRequestHeadCommit:
    description: Event head SHA, required for pull requests and matched to the tested merge's second parent.
    required: false
  eventName:
    description: push, pull_request or workflow_dispatch.
    required: true
  modulePaths:
    description: Comma-separated module paths for manual runs.
    required: false
  createReleaseTag:
    description: Whether release tags were requested.
    default: 'false'
  publishOnly:
    description: Whether only release-tag creation was requested.
    default: 'false'
  customLocation:
    description: Optional resource location override.
    required: false
  staticValidation:
    description: Whether static validation was requested.
    default: 'true'
  deploymentValidation:
    description: Whether deployment validation was requested.
    default: 'true'
  removeDeployment:
    description: Whether deployment resources should be removed.
    default: 'true'
outputs:
  baseCommit:
    description: Available base SHA, or empty for the documented push fallback.
    value: ${{ steps.matrix.outputs.baseCommit }}
  targetCommit:
    description: Validated target SHA.
    value: ${{ steps.matrix.outputs.targetCommit }}
  hasModules:
    description: Whether the matrix has module entries.
    value: ${{ steps.matrix.outputs.hasModules }}
  includeAllVersionedModules:
    description: Whether the missing-push-base static and preview fallback was used.
    value: ${{ steps.matrix.outputs.includeAllVersionedModules }}
  moduleMatrix:
    description: Module include matrix as JSON.
    value: ${{ steps.matrix.outputs.moduleMatrix }}
  workflowInput:
    description: Validation and location inputs as JSON.
    value: ${{ steps.matrix.outputs.workflowInput }}
runs:
  using: composite
  steps:
    - name: Select workflow modules
      id: matrix
      shell: pwsh
      env:
        AVM_ACTION_PATH: ${{ github.action_path }}
        BASE_COMMIT: ${{ inputs.baseCommit }}
        TARGET_COMMIT: ${{ inputs.targetCommit }}
        PULL_REQUEST_HEAD_COMMIT: ${{ inputs.pullRequestHeadCommit }}
        EVENT_NAME: ${{ inputs.eventName }}
        MODULE_PATHS: ${{ inputs.modulePaths }}
        CREATE_RELEASE_TAG: ${{ inputs.createReleaseTag }}
        PUBLISH_ONLY: ${{ inputs.publishOnly }}
        CUSTOM_LOCATION: ${{ inputs.customLocation }}
        STATIC_VALIDATION: ${{ inputs.staticValidation }}
        DEPLOYMENT_VALIDATION: ${{ inputs.deploymentValidation }}
        REMOVE_DEPLOYMENT: ${{ inputs.removeDeployment }}
      run: |
        $root = [IO.Path]::GetFullPath((Join-Path $env:AVM_ACTION_PATH '..' '..' '..'))
        . (Join-Path $root 'scripts' 'bicep-workflows' 'Discovery.ps1')
        Initialize-AvmWorkflow -Profile Package -Confirm:$false
        $parameters = @{
          Root = $env:GITHUB_WORKSPACE; EventName = $env:EVENT_NAME
          BaseCommit = $env:BASE_COMMIT; TargetCommit = $env:TARGET_COMMIT; ModulePaths = $env:MODULE_PATHS
          PullRequestHeadCommit = $env:PULL_REQUEST_HEAD_COMMIT
          CreateReleaseTag = ConvertTo-AvmWorkflowBoolean $env:CREATE_RELEASE_TAG
          PublishOnly = ConvertTo-AvmWorkflowBoolean $env:PUBLISH_ONLY
          StaticValidation = ConvertTo-AvmWorkflowBoolean $env:STATIC_VALIDATION
          DeploymentValidation = ConvertTo-AvmWorkflowBoolean $env:DEPLOYMENT_VALIDATION
          RemoveDeployment = ConvertTo-AvmWorkflowBoolean $env:REMOVE_DEPLOYMENT
          CustomLocation = $env:CUSTOM_LOCATION
        }
        $outputs = Initialize-AvmWorkflowMatrix @parameters
        foreach ($entry in $outputs.GetEnumerator()) { Write-AvmWorkflowOutput -Name $entry.Key -Value $entry.Value }
